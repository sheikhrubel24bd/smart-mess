name: Create Smart-Mess Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-release-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release upload keystore
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          keytool -genkeypair -v \
            -keystore smart-mess-upload.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias smartmessupload \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Smart Mess Upload, OU=Mobile, O=Smart Mess, L=Yanbu, ST=Madinah, C=SA"
          keytool -list -v -keystore smart-mess-upload.jks \
            -storepass "$STORE_PASSWORD" -alias smartmessupload
      - name: Upload keystore as a one-time artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mess-Release-Keystore
          path: smart-mess-upload.jks
          retention-days: 7
          if-no-files-found: error

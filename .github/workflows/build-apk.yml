name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Bundle Capacitor App Plugin
        run: npx --yes esbuild@0.24.2 www/app-plugin.js --bundle --format=iife --outfile=www/app-plugin.bundle.js
      - name: Create Android project
        run: npx cap add android
      - name: Match Android status bar with app header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          style_files = list(Path("android/app/src/main/res").glob("values*/styles.xml"))
          if not style_files:
              raise SystemExit("Android styles.xml not found")

          updated = 0
          for path in style_files:
              source = path.read_text()
              def patch(match):
                  nonlocal_dummy = None
                  attrs = match.group(1)
                  block = match.group(0)
                  if not re.search(r'name=["\\']AppTheme\\.(?:NoActionBar|NoActionBarLaunch)["\\']', attrs):
                      return block
                  additions = []
                  if "name=\\"android:statusBarColor\\"" not in block:
                      additions.append('    <item name="android:statusBarColor">#16794f</item>')
                  if "name=\\"android:windowLightStatusBar\\"" not in block:
                      additions.append('    <item name="android:windowLightStatusBar">false</item>')
                  if additions:
                      block = block.replace("</style>", "\\n" + "\\n".join(additions) + "\\n  </style>")
                  return block

              result = re.sub(r'(<style\\b([^>]*)>.*?</style>)', lambda m: patch_style(m), source, flags=re.S) if False else source
              pattern = re.compile(r'<style\\b([^>]*)>.*?</style>', re.S)
              def patch_style(m):
                  nonlocal updated
                  block = m.group(0)
                  attrs = m.group(1)
                  if not re.search(r'name=["\\']AppTheme\\.(?:NoActionBar|NoActionBarLaunch)["\\']', attrs):
                      return block
                  additions = []
                  if 'name="android:statusBarColor"' not in block:
                      additions.append('    <item name="android:statusBarColor">#16794f</item>')
                  if 'name="android:windowLightStatusBar"' not in block:
                      additions.append('    <item name="android:windowLightStatusBar">false</item>')
                  if additions:
                      updated += 1
                      return block.replace("</style>", "\\n" + "\\n".join(additions) + "\\n  </style>")
                  return block
              source = pattern.sub(patch_style, source)
              path.write_text(source)

          if updated == 0:
              raise SystemExit("No Android app theme was updated")
          print(f"Updated {updated} Android theme(s)")
          PY
      - name: Prepare app icon source
        run: |
          mkdir -p assets
          cp www/logo.png assets/logo.png
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#f0fff7'
      - name: Add camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

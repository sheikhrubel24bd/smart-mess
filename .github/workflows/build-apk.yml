name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Bundle Capacitor App Plugin
        run: npx --yes esbuild@0.24.2 www/app-plugin.js --bundle --format=iife --outfile=www/app-plugin.bundle.js
      - name: Create Android project
        run: npx cap add android
      - name: Match Android status bar with app header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          style_files = list(Path("android/app/src/main/res").glob("values*/styles.xml"))
          if not style_files:
              raise SystemExit("Android styles.xml not found")

          style_pattern = re.compile(r'<style[^>]*>.*?</style>', re.S)
          updated = [0]

          for path in style_files:
              source = path.read_text()

              def patch_style(match):
                  block = match.group(0)
                  additions = []
                  if 'name="android:statusBarColor"' not in block:
                      additions.append('    <item name="android:statusBarColor">#16794f</item>')
                  if 'name="android:windowLightStatusBar"' not in block:
                      additions.append('    <item name="android:windowLightStatusBar">false</item>')
                  if additions:
                      updated[0] += 1
                      return block.replace("</style>", chr(10) + chr(10).join(additions) + chr(10) + "  </style>")
                  return block

              path.write_text(style_pattern.sub(patch_style, source))

          if updated[0] == 0:
              raise SystemExit("No Android theme was updated")
          print(f"Updated {updated[0]} Android theme(s)")
          PY
      - name: Prepare app icon source
        run: |
          mkdir -p assets
          cp www/logo.png assets/logo.png
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#f0fff7'
      - name: Add camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sync web files
        run: npx cap sync android
      - name: Restore or create stable Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "android-debug.keystore" ]; then
            cp android-debug.keystore "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$HOME/.android/debug.keystore" android-debug.keystore
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Print Android debug SHA-1
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -m 1 "SHA1:"
      - name: Upload debug keystore for reuse
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mess-Debug-Keystore
          path: android-debug.keystore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

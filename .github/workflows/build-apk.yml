name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.script_type = ""
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.in_script = True
                      self.external = "src" in attrs
                      self.script_type = attrs.get("type", "").lower()

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and self.script_type not in ("application/json", "application/ld+json"):
                          code = "".join(self.current).strip()
                          if code:
                              self.scripts.append(code)
                      self.in_script = False
                      self.external = False
                      self.script_type = ""
                      self.current = []

          parser = ScriptExtractor()
          parser.feed(Path("www/index.html").read_text(encoding="utf-8"))
          if not parser.scripts:
              raise SystemExit("No inline JavaScript found in www/index.html")

          with tempfile.TemporaryDirectory() as temp:
              for index, code in enumerate(parser.scripts, 1):
                  path = Path(temp) / f"inline-{index}.js"
                  path.write_text(code, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(path)])
                  if result.returncode:
                      raise SystemExit(f"JavaScript syntax error in inline script #{index}")

          print(f"JavaScript syntax check passed: {len(parser.scripts)} inline script(s)")
          PY
      - name: Bundle Capacitor App Plugin
        run: npx --yes esbuild@0.24.2 www/app-plugin.js --bundle --format=iife --outfile=www/app-plugin.bundle.js
      - name: Create Android project
        run: npx cap add android
      - name: Disable Android WebView overscroll bounce
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(files)}")

          path = files[0]
          source = path.read_text()
          if "OVER_SCROLL_NEVER" not in source:
              source = source.replace(
                  "package ",
                  "package ",
                  1
              )
              package_end = source.find("\n")
              source = source[:package_end + 1] + "\nimport android.os.Bundle;\nimport android.view.View;\n" + source[package_end + 1:]
              class_match = re.search(r"public class MainActivity extends BridgeActivity\s*\{", source)
              if not class_match:
                  raise SystemExit("MainActivity class declaration not found")
              method = """
                  @Override
                  public void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().setOverScrollMode(View.OVER_SCROLL_NEVER);
                      }
                  }
              """
              insert_at = class_match.end()
              source = source[:insert_at] + method + source[insert_at:]
              path.write_text(source)
          print(f"Disabled WebView overscroll in {path}")
          PY
      - name: Set Smart-Mess green status bar and white icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          style_files = list(Path("android/app/src/main/res").glob("values*/styles.xml"))
          if not style_files:
              raise SystemExit("Android styles.xml not found")

          names = {
              "android:statusBarColor": "#16794f",
              "android:windowLightStatusBar": "false",
              "android:windowOptOutEdgeToEdgeEnforcement": "true",
          }

          updated = 0
          for path in style_files:
              source = path.read_text()
              def patch_style(match):
                  nonlocal_dummy = None
                  block = match.group(0)
                  for name, value in names.items():
                      item = f'<item name="{name}">{value}</item>'
                      pattern = re.compile(r'<item\s+name="' + re.escape(name) + r'">.*?</item>', re.S)
                      if pattern.search(block):
                          block = pattern.sub(item, block)
                      else:
                          block = block.replace("</style>", "    " + item + "\n  </style>")
                  return block
              changed = re.sub(r'<style[^>]*>.*?</style>', patch_style, source, flags=re.S)
              if changed != source:
                  updated += 1
                  path.write_text(changed)

          if updated == 0:
              raise SystemExit("No Android theme was updated")
          print(f"Updated {updated} Android theme file(s)")
          PY
      - name: Prepare app icon source
        run: |
          mkdir -p assets
          cp www/logo.png assets/logo.png
      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#f0fff7'
      - name: Add camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Generate Delete Mess PNG icon
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='www/icons/delete-mess.svg', write_to='www/icons/delete-mess.png', output_width=128, output_height=128)
          print('Generated www/icons/delete-mess.png')
          PY
      - name: Sync web files
        run: npx cap sync android
      - name: Restore or create stable Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "android-debug.keystore" ]; then
            cp android-debug.keystore "$HOME/.android/debug.keystore"
          else
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$HOME/.android/debug.keystore" android-debug.keystore
      - name: Force stable keystore for Android debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          source = path.read_text()
          marker = "// SMART_MESS_STABLE_DEBUG_SIGNING"
          if marker not in source:
              source += """

          // SMART_MESS_STABLE_DEBUG_SIGNING
          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file("../android-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          """
              path.write_text(source)
          print("Configured debug APK to use the repository's stable keystore.")
          PY
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK signing SHA-1
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          EXPECTED="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | awk '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "apksigner path: $APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          echo "$CERT_OUTPUT"
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/.*SHA-1 digest: *([0-9A-Fa-f: ]+).*/\1/p' | head -n 1 | tr -d ' :' | tr '[:lower:]' '[:upper:]')"
          echo "Expected signing SHA-1: $EXPECTED"
          echo "Actual APK signing SHA-1: $ACTUAL"
          test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL"
      - name: Upload debug keystore for reuse
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mess-Debug-Keystore
          path: android-debug.keystore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

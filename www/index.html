<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Mess</title>

<style>
  /* SMART MESS RESPONSIVE SPLASH SCREEN */
#splash{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#f0fff7;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:16px;
}

.splash-stage{
  position:relative;
  width:min(78vw, 34vh, 320px);
  aspect-ratio:1 / 1;
  flex:0 0 auto;
}

.splash-stage::before{
  content:"";
  position:absolute;
  inset:0;
  border:2px dashed #218b50;
  border-radius:50%;
}

.splash-logo{
  position:absolute;
  width:80%;
  height:80%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  object-fit:contain;
  z-index:2;
}

.splash-orbit{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  animation:orbit 5s linear infinite;
  z-index:3;
  pointer-events:none;
}

.splash-dot{
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  box-shadow:0 0 12px currentColor;
  transform:translate(-50%,-50%);
}

.dot-red{
  top:0;
  left:50%;
  color:#ff3030;
  background:#ff3030;
}

.dot-blue{
  top:75%;
  left:93.3%;
  color:#2196f3;
  background:#2196f3;
}

.dot-orange{
  top:75%;
  left:6.7%;
  color:#ff9800;
  background:#ff9800;
}

.splash-title{
  margin-top:clamp(16px, 3vh, 30px);
  color:#218b50;
  font-size:clamp(23px, 6vw, 27px);
  font-weight:800;
  text-align:center;
}

.splash-loading{
  margin-top:clamp(4px, 1vh, 8px);
  color:#638b74;
  font-size:clamp(13px, 3.5vw, 14px);
  text-align:center;
}

@keyframes orbit{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

:root{--bg:#f4f6f1;--card:#fff;--ink:#17261f;--mut:#667a70;--pri:#16794f;--pri2:#dff1e7;--on:#fff;--bad:#c93d3d;--bad2:#fbe6e6;--bd:#dde4dc;--warm:#f2b134;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--ink:#e8f0ea;--mut:#92a89b;--pri:#3dbd85;--pri2:#1f3a2e;--on:#0b1a12;--bad:#ff7b7b;--bad2:#3b2222;--bd:#2b3a32}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--ink:#e8f0ea;--mut:#92a89b;--pri:#3dbd85;--pri2:#1f3a2e;--on:#0b1a12;--bad:#ff7b7b;--bad2:#3b2222;--bd:#2b3a32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri","Kalpurush",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:16px 14px 112px}
.top.app-topbar{
  display:flex;align-items:center;gap:9px;
  min-height:62px;margin:-16px -14px 14px;
  padding:0 14px;background:#16794f;color:#fff;
  box-shadow:0 3px 10px #0c513326;
}
.app-brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-size:19px;font-weight:800;white-space:nowrap}
.app-brand-mark{width:33px;height:33px;border:1.7px solid #ffffffb8;border-radius:11px;display:grid;place-items:center;font-size:21px;line-height:1}
.top.app-topbar .x,.top.app-topbar .bell,.top.app-topbar .lang{
  color:#fff;border:0;background:transparent;
}
.top.app-topbar .x{font-size:25px;padding:4px 7px}
.top.app-topbar .bell{font-size:22px;padding:4px 7px}
.top.app-topbar .bell i{background:#ffcf4a;color:#263629}
.top.app-topbar .lang{border:1px solid #ffffff80;border-radius:10px;padding:6px 9px;font-size:13px}
.top.app-topbar .sp{display:block;flex:1;min-width:0}

/* PULL TO REFRESH */
#pullRefresh{
  position:fixed;
  top:env(safe-area-inset-top, 8px);
  left:50%;
  transform:translate(-50%,-60px);
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  color:var(--pri);
  box-shadow:0 2px 10px #0002;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  z-index:999;
  transition:transform .2s;
}

#pullRefresh.loading{
  transform:translate(-50%,12px);
}

#pullRefresh.loading span{
  animation:refreshSpin .8s linear infinite;
}

@keyframes refreshSpin{
  to{transform:rotate(360deg)}
}

h1{font-size:26px;margin:4px 0 2px}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;cursor:pointer}
  /* BUTTON TOUCH EFFECT */
button{
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease, filter .15s ease;
}
button:active{
  filter:brightness(.88);
}
button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.btn{width:100%;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-weight:700;padding:15px;font-size:17px}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn:disabled{opacity:.4}
input[type=text]{
  width:100%;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--ink);
  border-radius:10px;
  padding:12px;
  font:inherit;
  caret-color:#159447;
  cursor:text;
  outline-color:#159447;
}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:14px 10px;text-align:center}
.type.on{border-color:var(--pri);background:var(--pri2)}
.type b{display:block;font-size:17px}.type span{font-size:30px;display:block}.type small{color:var(--mut);font-size:13px;line-height:1.3;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 14px}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ic{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center}
.ic span{font-size:38px;display:block;line-height:1.2}.ic small{font-size:14px;font-weight:600}
.ic:active{background:var(--pri2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat.hero{grid-column:1/3;background:var(--pri);color:var(--on);border-color:var(--pri)}
.stat.hero b{font-size:34px}
 .stat.deposit-stat{
  background:#e5f4f5;
  border:1px solid #b5dfe1;
  color:#176b70;
}
.stat.deposit-stat small{
  color:#287f84;
}
.stat.deposit-stat b{
  font-size:26px;
}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}.li .e{font-size:28px}.li .t{flex:1}.li .t small{display:block;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:6px 10px}
.amt{font-size:46px;font-weight:800;text-align:center;padding:8px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.key{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 0;font-size:20px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1.5px solid var(--pri);background:var(--pri2);border-radius:10px;padding:9px 0;font-weight:700}
.step{border:1.5px solid var(--bd);background:var(--card);border-radius:50%;width:46px;height:46px;font-size:24px;font-weight:700}
.cnt{min-width:46px;text-align:center;font-size:22px;font-weight:800}
.pos{color:var(--pri)}.neg{color:var(--bad)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.tag.pos{background:var(--pri2)}.tag.neg{background:var(--bad2)}
nav{
  position:fixed;left:50%;right:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);width:calc(100% - 30px);max-width:452px;
  display:flex;justify-content:center;background:#16794f;border:0;
  border-radius:22px;padding:5px 7px;
  box-shadow:0 6px 18px #0c51334a;z-index:40;
}
nav div{display:flex;width:100%;max-width:none;gap:3px}
nav button{
  flex:1;min-width:0;border:0;border-radius:16px;background:transparent;
  padding:6px 2px;font-size:11px;line-height:1.2;color:#e6f4eb;text-align:center;
}
nav button span{display:block;line-height:1;margin:0 auto 4px}

.top.app-topbar .top-icon{position:relative;display:grid;place-items:center;min-width:34px;min-height:38px;padding:4px;border:0;background:transparent;color:#fff}
.top.app-topbar .top-icon .sm-icon{width:21px;height:21px}
.top.app-topbar .top-icon i{position:absolute;top:0;right:0;background:#ffcf4a;color:#263629;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;min-width:15px;padding:0 3px;text-align:center}
.nav-icon{width:19px;height:19px}

nav button.on{background:#35a866;color:#fff;font-weight:800}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:96px;
  width:calc(100% - 36px);
  max-width:420px;
  box-sizing:border-box;
  background:var(--ink);
  color:var(--bg);
  padding:14px 18px;
  border-radius:14px;
  font-weight:600;
  font-size:14px;
  line-height:1.6;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
  z-index:50;
}
.sample{background:var(--pri2);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:40px}.sp{flex:1}
.lang{border:1.5px solid var(--pri);color:var(--pri);background:var(--card);border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px}
.bell{position:relative;border:0;background:none;font-size:24px;padding:2px 6px}
.bell i{position:absolute;top:-4px;right:-2px;background:var(--bad);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;min-width:18px;padding:0 5px;text-align:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:2px}
.banner{width:100%;border:0;background:var(--warm);color:#2a1d00;font-weight:700;border-radius:12px;padding:12px;margin-bottom:10px;font-size:15px}
select{border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;max-width:60%}
.bar{height:8px;background:var(--pri2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.thumb{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.ov img{max-width:100%;max-height:100%;border-radius:10px}
  /* NEW TASK VIEW DESIGN */
.task-page{padding-bottom:18px}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 18px}
.task-heading{display:flex;align-items:center;gap:10px}
.task-heading-icon{width:44px;height:44px;border-radius:12px;background:#dff2e6;color:#087344;display:grid;place-items:center;font-size:24px}
  .task-heading-icon{
  flex-shrink:0;
  box-shadow:0 3px 8px #08734418;
}

.task-heading h2{
  line-height:1.3;
}

.task-subtitle{
  line-height:1.5;
}
.task-heading h2{margin:0;font-size:21px;color:#111}
.task-subtitle{font-size:12px;color:#444;margin-top:3px}
.task-add-toggle{border:0;border-radius:25px;background:#d9f2df;color:#087344;padding:10px 13px;font-weight:800;white-space:nowrap}
.task-form{background:#fff;border:1px solid #b9dfc7;border-radius:16px;padding:14px;margin-bottom:18px}
  .task-form h3{
  margin:0 0 14px;
  color:#087344;
  font-size:17px;
}

.task-form input{
  width:100%;
  box-sizing:border-box;
  margin-bottom:10px;
  padding:12px;
  border:1px solid #c5dfcd;
  border-radius:10px;
  background:#fafffb;
  font-size:14px;
  outline:none;
}

.task-form input:focus{
  border-color:#168653;
  background:#fff;
}

.task-form .task-add-toggle{
  width:100%;
  padding:12px;
  font-size:14px;
}
  .task-section{
  display:block;
  background:#f7fcf8;
  border:1px solid #c6e3ce;
  border-radius:16px;
  padding:12px;
  margin:20px 0;
  color:#075c36;
}
  /* PENDING TASK SECTION */
.pending-section{
  background:#fffaf2;
  border:1px solid #f0d7ad;
  border-left:4px solid #e9a23b;
  border-radius:16px;
  padding:12px;
  margin:20px 0;
}

.pending-section > .task-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff0dc;
  color:#925000;
  border-radius:10px;
  padding:11px 12px;
  margin-bottom:12px;
}

/* COMPLETED TASK SECTION */
.completed-section{
  background:#f3fbf5;
  border:1px solid #b9dfc7;
  border-left:4px solid #168653;
  border-radius:16px;
  padding:12px;
  margin:20px 0;
}

.completed-section > .task-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#dff3e5;
  color:#087344;
  border-radius:10px;
  padding:11px 12px;
  margin-bottom:12px;
}

/* SECTION TITLES */
.task-section > .task-heading h3{
  margin:0;
  font-size:15px;
  font-weight:800;
}

/* TASK COUNTS */
.task-section .task-count{
  min-width:22px;
  text-align:center;
  padding:4px 10px;
}

/* EMPTY MESSAGE */
.task-section .task-empty{
  margin-top:8px;
}
 .task-count{background:#168653;color:#fff;border-radius:20px;padding:3px 10px;font-size:12px}
.task-item{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  align-items:start;
  gap:8px;
  padding:9px 10px;
  margin-bottom:7px;
  background:#fff;
  border:1px solid #c6e3ce;
  border-radius:12px;
  position:relative;
}
.task-item.done{
  background:#f0faf3;
}
.task-item > .task-status{
  grid-column:3;
  grid-row:1;
  margin:0;
  align-self:start;
  white-space:nowrap;
  font-size:10px;
  padding:4px 7px;
}
.task-item > .task-info{
  grid-column:2;
  grid-row:1;
}
.task-item > .task-actions{
  grid-column:3;
  grid-row:1;
  align-self:center;
  margin-top:22px;
}
.task-check{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e4f4e9;color:#087344;font-size:21px}
  .task-check{
  border:2px solid #168653;
  cursor:pointer;
  flex-shrink:0;
}

.task-check:disabled{
  border-color:#168653;
  background:#168653;
  color:#fff;
  opacity:1;
  cursor:default;
}
.task-info{min-width:0}
  .task-info{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:3px;
}

.task-title{
  width:100%;
  line-height:1.5;
}

.task-meta{
  width:100%;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.task-status{
  margin-top:6px;
}
.task-title{font-size:15px;font-weight:800;color:#111;overflow-wrap:anywhere}
.task-meta{font-size:11px;color:#4b554e;margin-top:5px;line-height:1.5}
.task-status{font-size:11px;font-weight:800;border-radius:20px;padding:6px 9px;white-space:nowrap}
.task-status.pending{background:#fff0dc;color:#a85b00}
 .task-status{
  display:inline-block;
  margin-top:7px;
  letter-spacing:.2px;
}

.task-item.done .task-status.completed{
  background:#dff3e5;
  color:#087344;
} 
.task-status.completed{background:#dff3e5;color:#087344}
.task-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.task-actions .btn{width:auto;padding:8px 12px;font-size:13px}
.task-more{border:0;background:transparent;color:#087344;font-size:22px;padding:3px 7px}
  .task-actions{
  position:relative;
  justify-content:flex-end;
  align-items:center;
}

.task-actions .row{
  position:absolute;
  right:0;
  top:32px;
  z-index:5;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:100px;
  padding:8px;
  background:#fff;
  border:1px solid #b9dfc7;
  border-radius:10px;
  box-shadow:0 4px 12px #00000018;
}

.task-actions .row .btn{
  width:100%;
  white-space:nowrap;
}
.task-empty{text-align:center;background:#fff;border:1px dashed #9ac9aa;border-radius:14px;padding:20px;color:#52645a;font-size:14px}
  @media(max-width:480px){
  .task-head{
    align-items:flex-start;
  }

  .task-item{
    grid-template-columns:38px minmax(0,1fr) auto;
    gap:8px;
    padding:10px;
  }

  .task-title{
    font-size:14px;
  }

  .task-status{
    font-size:10px;
    padding:5px 7px;
  }

  .task-actions .row{
    right:0;
  }
}

/* AUTOMATIC DARK MODE: keep custom page text readable */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
  }
  .task-heading h2,.task-title{color:var(--ink)}
  .task-subtitle{color:var(--mut)}
  .task-form{background:var(--card);border-color:var(--bd)}
  .task-form input{background:var(--bg);color:var(--ink);border-color:var(--bd)}
  .task-form input:focus{background:var(--card)}
  .task-section{background:var(--card);color:var(--ink);border-color:var(--bd)}
  .pending-section{background:#29251d;border-color:#66502f}
  .pending-section>.task-heading{background:#403321;color:#ffd18a}
  .completed-section{background:#1b2b22;border-color:#315a40}
  .completed-section>.task-heading{background:#263e30;color:#a7e8bd}
  .task-item,.task-empty{background:var(--bg);color:var(--ink);border-color:var(--bd)}
  .task-item.done{background:#1d3025}
  .task-meta{color:var(--mut)}
  .task-actions .row{background:var(--card);border-color:var(--bd)}
  .task-status.pending{background:#49351f;color:#ffd18a}
  .task-item.done .task-status.completed,.task-status.completed{background:#244532;color:#a7e8bd}
  .task-check{background:#244532;color:#a7e8bd}
  .task-check:disabled{background:#168653;color:#fff}
  .task-add-toggle{background:#244532;color:#a7e8bd}
  .stat.deposit-stat{background:#183437;border-color:#28585a;color:#a5e1e2}
  .stat.deposit-stat small{color:#a5e1e2}
  #app [style*="background:#d1fae5"]{background:#244532!important;color:#a7e8bd!important}
  #app [style*="background:#dcfce7"]{background:#244532!important;color:#a7e8bd!important}
}
:root[data-theme="dark"]{
  color-scheme:dark;
}
:root[data-theme="dark"] .task-heading h2,

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

gas:['🔥','গ্যাস','Gas','f'],elec:['💡','বিদ্যুৎ','Electricity','f'],net:['📶','ইন্টারনেট','Internet','f'],rent:['🏠','ভাড়া','Rent','f'],maid:['👩','বুয়া','Maid','f'],clean:['🧼','ক্লিনিং','Cleaning','f']};

}

function calc(){
  const n=M.members.length;
  let baz=0,fix=0;

  const deposited=M.members.map(()=>0);
  const paid=M.members.map(()=>0);

  // প্রত্যেক সদস্যের মোট জমা
  (M.deposits||[]).forEach(d=>{
    const i=M.memberUids.indexOf(d.uid);
    if(i>=0) deposited[i]+=Number(d.amt)||0;
  });

  // জমা + পকেট থেকে বাজার
  M.members.forEach((_,i)=>{
    paid[i]=deposited[i];
  });

  M.exp.forEach(e=>{
    IT[e.item][3]=='b'?baz+=e.amt:fix+=e.amt;

    if((e.source||'pocket')==='pocket'){
      const i=M.memberUids.indexOf(e.payerUid);
      if(i>=0)paid[i]+=e.amt;
      else if(e.payer!=null)paid[e.payer]+=e.amt;
    }
  });

  const tm=M.members.reduce((a,_,i)=>a+(M.meals[i]||0),0);
  const meal=M.type=='meal';
  const rate=meal&&tm?baz/tm:0;

  const due=M.members.map((_,i)=>
    meal?(M.meals[i]||0)*rate+fix/n:(baz+fix)/n
  );

  const bal=due.map((d,i)=>paid[i]-d);

  return{
    n,baz,fix,paid,deposited,tm,rate,due,bal,
    tot:baz+fix,
    per:(baz+fix)/n
  };
}
  function calcAllMembers(){

  const members=M.allMembers||M.memberUids.map((uid,i)=>({
    uid,
    name:M.members[i],
    status:'active'
  }));

  const accounts={};

  members.forEach(m=>{
    accounts[m.uid]={
      uid:m.uid,
      name:m.name,
      meals:Number(M.mealCountsByUid?.[m.uid])||0,
      deposited:0,
      personalExpenses:0,
      share:0,
      paid:0,
      due:0,
      bal:0
    };
  });

  // সদস্যদের জমা
  (M.deposits||[]).forEach(d=>{
    if(accounts[d.uid]){
      accounts[d.uid].deposited+=Number(d.amt)||0;
    }
  });

  // প্রতিটি খরচের ভাগ
  (M.exp||[]).forEach(e=>{

    const expenseTime=Number(e.d)||0;

const roster=e.memberUidsAtTime?.length
  ? e.memberUidsAtTime
  : (M.allMembers||[]).filter(m=>{

      const joined=m.joinedAt;
      const left=m.leftAt;

      const joinedTime=joined?.toMillis
        ? joined.toMillis()
        : joined instanceof Date
          ? joined.getTime()
          : Number(joined)||0;

      const leftTime=left?.toMillis
        ? left.toMillis()
        : left instanceof Date
          ? left.getTime()
          : Number(left)||0;

      return (!joinedTime || joinedTime<=expenseTime)
        && (!leftTime || leftTime>=expenseTime);

    }).map(m=>m.uid);

    const participants=roster.filter(uid=>accounts[uid]);

    if(!participants.length)return;

    const amount=Number(e.amt)||0;
    const isMarket=IT[e.item]?.[3]==='b';

    if(M.type==='meal' && isMarket){

      const totalMeals=participants.reduce(
        (sum,uid)=>sum+accounts[uid].meals,0
      );

      participants.forEach(uid=>{
        const share=totalMeals>0
          ? amount*accounts[uid].meals/totalMeals
          : amount/participants.length;

        accounts[uid].share+=share;
      });

    }else{

      const share=amount/participants.length;

      participants.forEach(uid=>{
        accounts[uid].share+=share;
      });
    }

    // পকেট থেকে দেওয়া খরচ
    if((e.source||'pocket')==='pocket' && accounts[e.payerUid]){
      accounts[e.payerUid].personalExpenses+=amount;
    }

  });

  // চূড়ান্ত হিসাব
  Object.values(accounts).forEach(a=>{

    a.paid=a.deposited+a.personalExpenses;
    a.due=a.share;
    a.bal=a.paid-a.due;

  });

  return Object.values(accounts);
}

function settle(bal){
  const d=[],c=[];bal.forEach((b,i)=>{if(b<-0.5)d.push([i,-b]);else if(b>0.5)c.push([i,b])});
  d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const r=[];
  while(d.length&&c.length){const x=Math.min(d[0][1],c[0][1]);r.push([d[0][0],c[0][0],x]);d[0][1]-=x;c[0][1]-=x;if(d[0][1]<.5)d.shift();if(c[0][1]<.5)c.shift()}
  return r;
}

async function authAction(){

    return say(T('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে','Password must be at least 6 characters'));

  if(signup&&!name)
    return say(T('আপনার নাম লিখুন','Enter your name'));

    const btn=document.getElementById('authBtn');
  if(btn?.disabled)return;

  const oldText=btn?.innerHTML;
  if(btn)btn.disabled=true;

  const loadingTimer=setTimeout(()=>{
    if(btn){
      btn.innerHTML='<span style="display:inline-block;animation:refreshSpin .8s linear infinite">⟳</span> '+T('লোড হচ্ছে...','Loading...');

  },500);
  
  try{
    let result;

    if(signup){
      result=await auth.createUserWithEmailAndPassword(email,pass);

    }else{
      result=await auth.signInWithEmailAndPassword(email,pass);
    }

    };

    const userRef=db.collection('users').doc(result.user.uid);

    if(!userSnap.exists){
      await userRef.set({
        uid:result.user.uid,
        name:S.user.name,
        email:S.user.email,
        messId:null,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }

  }catch(e){
    console.error('AUTH ERROR:',e.code,e.message);

    const errors={

      'auth/invalid-email':T('ইমেইল ঠিকানা সঠিক নয়','Invalid email address'),

      'auth/user-not-found':T('এই ইমেইলে কোনো একাউন্ট নেই','No account found with this email'),
      'auth/wrong-password':T('পাসওয়ার্ড ভুল হয়েছে','Incorrect password'),
      'auth/invalid-credential':T('ইমেইল অথবা পাসওয়ার্ড ভুল','Incorrect email or password'),
      'auth/too-many-requests':T('অনেকবার চেষ্টা হয়েছে। পরে চেষ্টা করুন','Too many attempts. Try again later'),
      'auth/network-request-failed':T('ইন্টারনেট সংযোগ পরীক্ষা করুন','Check your internet connection')

        say(errors[e.code]||e.message);

function stopMessListeners(){
  const keys=[
    '_smartMessExpenseUnsub',
    '_smartMessMealUnsub',
    '_smartMessDepositUnsub',
    '_smartMessDailyMealUnsub',
    '_smartMessTaskUnsub'
  ];
  keys.forEach(key=>{
    const unsubscribe=window[key];
    window[key]=null;
    if(typeof unsubscribe==='function'){
      try{ unsubscribe(); }
      catch(error){ console.warn('LISTENER CLEANUP ERROR:',key,error); }
    }
  });
}

    const [messSnap,myMemberSnap,membersSnap,allMembersSnap]=await Promise.all([
  messRef.get(),
  messRef.collection('members').doc(uid).get(),
  messRef.collection('members').where('status','==','active').get(),
  messRef.collection('members').get()
]);

    let requestsSnap={docs:[]};

    if(myMemberSnap.exists && myMemberSnap.data().role=='admin'){
      requestsSnap=await messRef.collection('joinRequests').get();
    }

    if(!messSnap.exists || !myMemberSnap.exists)
      throw new Error('MESS_NOT_FOUND');

    const myMember=myMemberSnap.data();

    if(myMember.status!='active')
      throw new Error('MEMBERSHIP_INACTIVE');

    const data=messSnap.data();

    const memberDocs=membersSnap.docs.filter(d=>d.data().status=='active');

    const memberUids=memberDocs.map(d=>d.id);
    const members=memberDocs.map(d=>d.data().name);
    const memberPhones=memberDocs.map(d=>d.data().phone||'');

    M={
      id:messId,
      code:data.code,
      name:data.name,
      type:data.type,
      cur:data.currency,
      adminUid:data.adminUid,
      role:myMember.role,
      memberUids:memberUids,
      members:members,
      memberPhones:memberPhones,
      allMembers:allMembersSnap.docs.map(d=>({
  uid:d.id,
  name:d.data().name,
  status:d.data().status,
  joinedAt:d.data().joinedAt,
  leftAt:d.data().leftAt||null
})),
      me:memberUids.indexOf(uid),
      meals:{},
      mealCountsByUid:{},
      dailyMeals:{},
      deposits:[],
      exp:[],
      reqs:requestsSnap.docs.map(d=>{
        const r=d.data();
        return {
          uid:d.id,
          name:r.name,
          s:r.status=='pending'?'p':r.status=='accepted'?'a':'r'
        };
      })
    };

    S.members=[...members];
    S.payer=M.me;
    S.screen='app';
    S.tab='home';

    if(window._smartMessExpenseUnsub){
      window._smartMessExpenseUnsub();
      window._smartMessExpenseUnsub=null;
    }

    if(window._smartMessMealUnsub){
      window._smartMessMealUnsub();
      window._smartMessMealUnsub=null;
    }
        if(window._smartMessDepositUnsub){
      window._smartMessDepositUnsub();
      window._smartMessDepositUnsub=null;
    }

    render();

    // EXPENSE LIVE SYNC
    window._smartMessExpenseUnsub=
      messRef.collection('expenses').onSnapshot(snapshot=>{

        if(!M || M.id!=messId) return;

        M.exp=snapshot.docs.map(doc=>{
          const e=doc.data();

          return {
  id:doc.id,
  item:e.item,
  otherName:e.otherName||'',          
  payer:memberUids.indexOf(e.payerUid),
  payerUid:e.payerUid,
  memberUidsAtTime:e.memberUidsAtTime||null,
  source:e.source||'pocket',         
  amt:e.amt,
  d:e.d,
  memo:e.memo
};
        });
      M.exp.sort((a,b)=>(Number(b.d)||0)-(Number(a.d)||0));

        render();

      },error=>{
        console.error('EXPENSE SYNC ERROR:',error);
        say('খরচ আপডেট করা যায়নি: '+(error.code||error.message));
      });

    // MEAL LIVE SYNC
    window._smartMessMealUnsub=
      messRef.collection('mealCounts').onSnapshot(snapshot=>{

        if(!M || M.id!=messId) return;

        M.meals={};
M.mealCountsByUid={};

snapshot.docs.forEach(doc=>{
  const count=Number(doc.data().count)||0;

  M.mealCountsByUid[doc.id]=count;

  const i=memberUids.indexOf(doc.id);

  if(i>=0){
    M.meals[i]=count;
  }
});

        render();

      },error=>{
        console.error('MEAL SYNC ERROR:',error);
        say('মিল আপডেট করা যায়নি: '+(error.code||error.message));
      });
        // DAILY MEALS LIVE SYNC
    window._smartMessDailyMealUnsub=
      messRef.collection('dailyMeals').onSnapshot(snapshot=>{

        if(!M || M.id!=messId) return;

        M.dailyMeals=snapshot.docs.map(doc=>({
          id:doc.id,
          ...doc.data()
        }));

        render();

      },error=>{
        console.error('DAILY MEAL SYNC ERROR:',error);
        say('দৈনিক মিল আপডেট করা যায়নি।');
      });

    
        // DEPOSIT LIVE SYNC
    window._smartMessDepositUnsub=
      messRef.collection('deposits').onSnapshot(snapshot=>{

        if(!M || M.id!=messId) return;

        M.deposits=snapshot.docs.map(doc=>({
          id:doc.id,
          ...doc.data()
        }));

        render();

      },error=>{
        console.error('DEPOSIT SYNC ERROR:',error);
        say('জমার হিসাব আপডেট করা যায়নি।');
      });

    // TASK LIVE SYNC
window._smartMessTaskUnsub=
  messRef.collection('tasks').onSnapshot(snapshot=>{

    if(!M || M.id!=messId) return;

    // সব টাস্ক অ্যাপে লোড
    M.tasks=snapshot.docs.map(doc=>({
      id:doc.id,
      ...doc.data()
    }));

    // ৪৮ ঘণ্টা পার হওয়া Completed Task খুঁজে বের করা
    const now=Date.now();

    const expiredTasks=snapshot.docs.filter(doc=>{

      const task=doc.data();

      return task.isDone===true
        && task.deleteAt
        && typeof task.deleteAt.toDate==='function'
        && task.deleteAt.toDate().getTime()<=now;

    });

    // মেয়াদ শেষ হওয়া টাস্ক মুছে ফেলা
    expiredTasks.forEach(doc=>{

      doc.ref.delete().catch(error=>{

        console.error(
          'TASK CLEANUP ERROR:',
          doc.id,
          error
        );

      });

    });

    render();

  },error=>{

    console.error('TASK SYNC ERROR:',error);

    say('টাস্ক আপডেট করা যায়নি।');

  });

  }catch(e){
  console.error('AFTER ERROR:',e.code,e.message,e);
  say('ERROR: '+(e.code||'unknown')+' - '+e.message);
}
}

async function start(){
  if(!auth.currentUser) return say(T('আগে লগইন করুন','Please login first'));

  const name=S.name.trim()||T('আমার মেস','My mess');
  const uid=auth.currentUser.uid;
  const userRef=db.collection('users').doc(uid);
  const messRef=db.collection('messes').doc();

  try{
    say(T('মেস তৈরি হচ্ছে...','Creating mess...'));

    const result=await db.runTransaction(async tx=>{
      const userSnap=await tx.get(userRef);

      if(!userSnap.exists)
        throw new Error('USER_PROFILE_MISSING');

      if(userSnap.data().messId)
        throw new Error('ALREADY_IN_MESS');

      let code='',codeRef=null;

      for(let i=0;i<10;i++){
        const candidate='SM-'+(1000+Math.floor(Math.random()*9000));
        const ref=db.collection('messCodes').doc(candidate);
        const snap=await tx.get(ref);

        if(!snap.exists){
          code=candidate;
          codeRef=ref;
          break;
        }
      }

      if(!code)
        throw new Error('CODE_GENERATION_FAILED');

      const now=firebase.firestore.FieldValue.serverTimestamp();

      tx.set(messRef,{
        name:name,
        code:code,
        type:S.type,
        currency:S.cur,
        adminUid:uid,
        ownerUid:uid,
        createdAt:now
      });

      tx.set(codeRef,{
        messId:messRef.id
      });

      tx.set(
        messRef.collection('members').doc(uid),
        {
          uid:uid,
          name:S.user.name,
          role:'admin',
          status:'active',
          joinedAt:now
        }
      );

      tx.update(userRef,{
        messId:messRef.id
      });

      return {code:code};
    });

    M={
  id:messRef.id,
  code:result.code,
  name:name,
  type:S.type,
  currency:S.cur,
  cur:S.cur,
  adminUid:uid,
  role:'admin',
  memberUids:[uid],
  members:[S.user.name],
  memberPhones:[''],
  me:0,
  meals:{},
  exp:[],
  reqs:[]
};

    S.payer=0;
    S.screen='app';
    S.tab='home';
    render();

    say(T('মেস তৈরি হয়েছে। কোড: ','Mess created. Code: ')+M.code);

  }catch(e){
    console.error(e);

    const errors={
      USER_PROFILE_MISSING:T('ইউজার তথ্য পাওয়া যায়নি।','User prof}ile not found.'),
      ALREADY_IN_MESS:T('আপনি ইতিমধ্যে একটি মেসে আছেন।','You already belong to a mess.'),
      CODE_GENERATION_FAILED:T('মেস কোড তৈরি করা যায়নি। আবার চেষ্টা করুন।','Could not generate a mess code.')
    };

    say(errors[e.message]||T('মেস তৈরি হয়নি। আবার চেষ্টা করুন।','Mess creation failed. Please try again.'));
  }
}

async function search(){
  const c=S.jcode.trim().toUpperCase();
  S.pend=null;
  S.found=null;

  if(!c){
    S.found=false;
    render();
    return;
  }

  try{
    const codeSnap=await db.collection('messCodes').doc(c).get();

    if(!codeSnap.exists){
      S.found=false;
      render();
      return;
    }

    const messId=codeSnap.data().messId;
    const messSnap=await db.collection('messes').doc(messId).get();

    if(!messSnap.exists){
      S.found=false;
      render();
      return;
    }

    const data=messSnap.data();

    S.found={
      id:messId,
      code:data.code,
      name:data.name,
      type:data.type,
      cur:data.currency
    };

  }catch(e){
    console.error(e);
    S.found=false;
    say('মেস খুঁজতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
  }

  render();
}
async function send(){
  const n=document.getElementById('jn').value.trim();
  const phone=document.getElementById('jp').value.trim();

  if(!n)
    return say(T('আপনার নাম লিখুন','Enter your name'));
  if(!phone)
    return say(T('মোবাইল নম্বর লিখুন','Enter your mobile number'));

  if(!auth.currentUser)
    return say(T('আগে লগইন করুন','Please login first'));

  const uid=auth.currentUser.uid;
  const messId=S.found.id;

  try{
    say(T('অনুরোধ পাঠানো হচ্ছে...','Sending request...'));

    const userRef=db.collection('users').doc(uid);
    const requestRef=db.collection('messes')
      .doc(messId)
      .collection('joinRequests')
      .doc(uid);

    await db.runTransaction(async tx=>{
      const userSnap=await tx.get(userRef);
      const requestSnap=await tx.get(requestRef);

      if(!userSnap.exists)
        throw new Error('USER_NOT_FOUND');

      if(userSnap.data().messId)
        throw new Error('ALREADY_IN_MESS');

      if(requestSnap.exists && requestSnap.data().status=='pending')
        throw new Error('REQUEST_EXISTS');

      tx.set(requestRef,{
        uid:uid,
        name:n,
        email:auth.currentUser.email,
        status:'pending',
        phone:phone,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    S.pend={name:n,s:'p'};
    say(T('যোগদানের অনুরোধ পাঠানো হয়েছে।','Join request sent successfully.'));
    render();

  }catch(e){
    console.error(e);

    const messages={
      USER_NOT_FOUND:'ইউজার তথ্য পাওয়া যায়নি।',
      ALREADY_IN_MESS:'আপনি ইতিমধ্যে একটি মেসে আছেন।',
      REQUEST_EXISTS:'আপনার অনুরোধ আগেই পাঠানো হয়েছে।'
    };

    say(messages[e.message]||'অনুরোধ পাঠানো যায়নি। Firebase Rules পরীক্ষা করতে হবে।');
  }
}

  if(!r || !r.uid)
    return say('অনুরোধের তথ্য পাওয়া যায়নি।');

  const uid=auth.currentUser.uid;

  async function leaveMess(){
  if(!M || M.role!=='member' || !auth.currentUser){
    return say(T('শুধু সাধারণ সদস্য মেস ত্যাগ করতে পারবেন।','Only regular members can leave the mess.'));
  }

  if(S.leavingMess)return;

  if(!confirm(T(
    'আপনি কি মেস ত্যাগ করতে চান? আপনার আগের হিসাব ও লেনদেন সংরক্ষিত থাকবে।',
    'Are you sure you want to leave this mess? Your previous accounts and transactions will be preserved.'
  ))) return;

  S.leavingMess=true;

  try{
    const uid=auth.currentUser.uid;
    const messRef=db.collection('messes').doc(M.id);
    const memberRef=messRef.collection('members').doc(uid);
    const userRef=db.collection('users').doc(uid);

    // Leave-এর আগে পুরোনো মেসের সব Listener বন্ধ করুন।
    stopMessListeners();

    await db.runTransaction(async tx=>{
      const messSnap=await tx.get(messRef);
      const memberSnap=await tx.get(memberRef);
      const userSnap=await tx.get(userRef);

      if(!messSnap.exists || !memberSnap.exists || !userSnap.exists)
        throw new Error('ACCOUNT_NOT_FOUND');

      const memberData=memberSnap.data();

      if(messSnap.data().adminUid===uid || memberData.role!=='member')
        throw new Error('ADMIN_CANNOT_LEAVE');

      if(memberData.status!=='active' || userSnap.data().messId!==M.id)
        throw new Error('NOT_ACTIVE_MEMBER');

      // শুধু সদস্যের status বন্ধ হবে; পুরোনো সদস্য ও হিসাবের রেকর্ড থাকবে।
      tx.update(memberRef,{
        status:'left',
        leftAt:firebase.firestore.FieldValue.serverTimestamp()
      });

      // একই account-কে অন্য মেসে যোগ দেওয়ার সুযোগ দেওয়া হবে।
      tx.set(userRef,{messId:null},{merge:true});
    });

    say(T(
      'আপনি মেস ত্যাগ করেছেন। আগের হিসাব সংরক্ষিত আছে।',
      'You have left the mess. Your previous records are preserved.'
    ));

    // লগআউট না করে একই অ্যাকাউন্টে মেস নির্বাচন/তৈরির পেজে ফিরুন।
    S.leavingMess=false;
    await after();

  }catch(e){
    console.error('LEAVE MESS ERROR:',e);
    S.leavingMess=false;

    // Leave ব্যর্থ হলে আগের Listener আবার চালু করুন।
    if(auth.currentUser && M){
      try{ await after(); }
      catch(reloadError){ console.error('MESS RELOAD ERROR:',reloadError); }
    }

    say(T(
      'মেস ত্যাগ করা যায়নি: '+(e.message||e.code),
      'Could not leave the mess: '+(e.message||e.code)
    ));
  }
}

async function resetMess(){
  if(!M || M.role!=='admin'){
    return say('শুধু অ্যাডমিন মেস রিসেট করতে পারবেন।');
  }

  if(S.resetting)return;

  if(!confirm('আপনি কি মেসের বর্তমান হিসাব রিসেট করতে চান? পুরোনো খরচ ও মিল History-তে সংরক্ষণ হবে।')){
    return;
  }

  S.resetting=true;
  let archiveComplete=false;

  try{
    say('পুরোনো হিসাব সংরক্ষণ করা হচ্ছে...');

    const messRef=db.collection('messes').doc(M.id);
    const historyRef=messRef.collection('history').doc();

    const [expensesSnap,mealsSnap,depositsSnap]=await Promise.all([
  messRef.collection('expenses').get(),
  messRef.collection('mealCounts').get(),
  messRef.collection('deposits').get()
]);

    await historyRef.set({
      status:'preparing',
      messName:M.name,
      messType:M.type,
      currency:M.cur,
      monthLabel:new Date().toLocaleDateString('bn-BD',{
        month:'long',
        year:'numeric'
      }),
      members:M.memberUids.map((uid,i)=>({
        uid:uid,
        name:M.members[i],
        phone:M.memberPhones[i]||''
      })),
            expenseCount:expensesSnap.size,
      mealCount:mealsSnap.size,
      depositCount:depositsSnap.size,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    const writes=[];

    expensesSnap.docs.forEach(doc=>{
      writes.push({
        ref:historyRef.collection('expenses').doc(doc.id),
        data:doc.data()
      });
    });

        mealsSnap.docs.forEach(doc=>{
      writes.push({
        ref:historyRef.collection('mealCounts').doc(doc.id),
        data:doc.data()
      });
    });
        depositsSnap.docs.forEach(doc=>{
      writes.push({
        ref:historyRef.collection('deposits').doc(doc.id),
        data:doc.data()
      });
    });

    for(let i=0;i<writes.length;i+=400){
      const batch=db.batch();

      writes.slice(i,i+400).forEach(item=>{
        batch.set(item.ref,item.data);
      });

      await batch.commit();
    }

    await historyRef.update({
      status:'complete'
    });

    archiveComplete=true;

    say('History সংরক্ষিত। নতুন হিসাব শুরু হচ্ছে...');

    const deletes=[
  ...expensesSnap.docs.map(doc=>doc.ref),
  ...mealsSnap.docs.map(doc=>doc.ref),
  ...depositsSnap.docs.map(doc=>doc.ref)
];

    for(let i=0;i<deletes.length;i+=400){
      const batch=db.batch();

      deletes.slice(i,i+400).forEach(ref=>{
        batch.delete(ref);
      });

      await batch.commit();
    }
      await cleanupOldHistory();

    S.tab='home';
    say('মেস রিসেট সম্পন্ন হয়েছে। পুরোনো হিসাব History-তে আছে।');

  }catch(e){
    console.error('MESS RESET ERROR:',e);

    if(archiveComplete){
      say('History নিরাপদে সংরক্ষিত হয়েছে, তবে পুরোনো হিসাব পরিষ্কার করতে সমস্যা হয়েছে। অ্যাডমিনের সাহায্য নিন।');
    }else{
      say('History সংরক্ষণ সম্পূর্ণ হয়নি। কোনো পুরোনো হিসাব মুছে ফেলা হয়নি। আবার চেষ্টা করুন।');
    }

  }finally{
    S.resetting=false;
  }
}

  async function cleanupOldHistory(){
  const historyRef=db.collection('messes')
    .doc(M.id)
    .collection('history');

  const snap=await historyRef.get();

  const completed=snap.docs
    .filter(doc=>doc.data().status==='complete')
    .sort((a,b)=>{
      const ta=a.data().createdAt?.toMillis?.()||0;
      const tb=b.data().createdAt?.toMillis?.()||0;
      return tb-ta;
    });

  // সর্বশেষ ৩টি বাদে বাকিগুলো মুছে ফেলবে
  const oldHistory=completed.slice(3);

  for(const historyDoc of oldHistory){
    const [expenses,meals,deposits]=await Promise.all([
  historyDoc.ref.collection('expenses').get(),
  historyDoc.ref.collection('mealCounts').get(),
  historyDoc.ref.collection('deposits').get()
]);

    const deletes=[
  ...expenses.docs.map(d=>d.ref),
  ...meals.docs.map(d=>d.ref),
  ...deposits.docs.map(d=>d.ref)
];

    for(let i=0;i<deletes.length;i+=400){
      const batch=db.batch();

      deletes.slice(i,i+400).forEach(ref=>{
        batch.delete(ref);
      });

      await batch.commit();
    }

    await historyDoc.ref.delete();
  }
}

async function transferAdmin(i){
  if(!M || M.role !== 'admin')
    return say('শুধু Admin এই কাজ করতে পারবেন।');

  const currentUid=auth.currentUser.uid;
  const targetUid=M.memberUids[i];
  const targetName=M.members[i];

  if(!targetUid || targetUid===currentUid)
    return;

  if(!confirm(T(
    targetName+'-কে কি নতুন Admin করতে চান?',
    'Transfer Admin rights to '+targetName+'?'
  ))) return;

  try{
    const messRef=db.collection('messes').doc(M.id);
    const oldRef=messRef.collection('members').doc(currentUid);
    const newRef=messRef.collection('members').doc(targetUid);

    await db.runTransaction(async tx=>{
      const messSnap=await tx.get(messRef);
      const oldSnap=await tx.get(oldRef);
      const newSnap=await tx.get(newRef);

      if(!messSnap.exists ||
         messSnap.data().adminUid!==currentUid ||
         !oldSnap.exists ||
         oldSnap.data().role!=='admin' ||
         oldSnap.data().status!=='active')
        throw new Error('NOT_ADMIN');

      if(!newSnap.exists ||
         newSnap.data().role!=='member' ||
         newSnap.data().status!=='active')
        throw new Error('INVALID_MEMBER');

      tx.update(messRef,{
        adminUid:targetUid
      });

      tx.update(oldRef,{
        role:'member'
      });

      tx.update(newRef,{
        role:'admin'
      });
    });

    M.role='member';
    M.adminUid=targetUid;

    say(T(
      'Adminship সফলভাবে হস্তান্তর হয়েছে।',
      'Admin rights transferred successfully.'
    ));

    render();

  }catch(e){
    console.error('ADMIN TRANSFER ERROR:',e);
    say(T(
      'Admin পরিবর্তন করা যায়নি: '+(e.message||e.code),
      'Admin transfer failed: '+(e.message||e.code)
    ));
  }
}

// সাবেক সদস্যদের তালিকা ও সর্বমোট মিল লোড
async function loadFormerMembers(){
  if(!M || M.role!=='admin') return;

  try{
    const messRef=db.collection('messes').doc(M.id);

    const [membersSnap,mealsSnap,historySnap]=await Promise.all([
      messRef.collection('members')
        .where('status','==','left')
        .get(),

      messRef.collection('mealCounts').get(),

      messRef.collection('history').get()
    ]);

    // প্রত্যেক সদস্যের মোট মিল
    const mealTotals={};

    // বর্তমান মাসের মিল যোগ
    mealsSnap.docs.forEach(doc=>{
      mealTotals[doc.id]=
        (mealTotals[doc.id]||0)+
        (Number(doc.data().count)||0);
    });

    // সব পুরোনো History-র মিল যোগ
    historySnap.docs.forEach(doc=>{
      const records=doc.data().mealRecords||[];

      records.forEach(r=>{
        const uid=r.uid||r.id;
        if(!uid) return;

        mealTotals[uid]=
          (mealTotals[uid]||0)+
          (Number(r.count)||0);
      });
    });

    // সাবেক সদস্যদের তথ্য তৈরি
    M.formerMembers=membersSnap.docs.map(doc=>({
      uid:doc.id,
      ...doc.data(),
      meals:mealTotals[doc.id]||0
    }));

    S.tab='formerMembers';
    render();

  }catch(e){
    console.error('FORMER MEMBERS ERROR:',e);
    say('সাবেক সদস্যদের তালিকা লোড করা যায়নি।');
  }
}

async function removeMember(i){
  if(!M || M.role!=='admin')
    return say('শুধু Admin এই কাজ করতে পারবেন।');

  const currentUid=auth.currentUser.uid;
  const targetUid=M.memberUids[i];
  const targetName=M.members[i];

  if(!targetUid || targetUid===currentUid)
    return;

  if(!confirm(T(
    'আপনি কি '+targetName+'-কে মেস থেকে বিদায় দিতে চান? তার পুরোনো হিসাব সংরক্ষিত থাকবে।',
    'Remove '+targetName+' from the mess? Their old accounting records will be preserved.'
  ))) return;

  try{
    const messRef=db.collection('messes').doc(M.id);
    const adminRef=messRef.collection('members').doc(currentUid);
    const targetRef=messRef.collection('members').doc(targetUid);
    const userRef=db.collection('users').doc(targetUid);

    await db.runTransaction(async tx=>{
      const messSnap=await tx.get(messRef);
      const adminSnap=await tx.get(adminRef);
      const targetSnap=await tx.get(targetRef);
      
      if(!messSnap.exists ||
         messSnap.data().adminUid!==currentUid ||
         !adminSnap.exists ||
         adminSnap.data().role!=='admin' ||
         adminSnap.data().status!=='active')
        throw new Error('NOT_ADMIN');

      if(!targetSnap.exists ||
   targetSnap.data().role!=='member' ||
   targetSnap.data().status!=='active')
  throw new Error('INVALID_MEMBER');

      // পুরোনো সদস্যের রেকর্ড থাকবে, শুধু Status পরিবর্তন হবে
      tx.update(targetRef,{
        status:'left',
        leftAt:firebase.firestore.FieldValue.serverTimestamp()
      });

      // সদস্যের Account অন্য মেসে যোগ দেওয়ার জন্য মুক্ত হবে
      tx.update(userRef,{
        messId:null
      });
    });

    // Active ও সব সদস্যের তালিকা নতুন করে লোড
const [snap,allMembersSnap]=await Promise.all([
  messRef.collection('members')
    .where('status','==','active').get(),
  messRef.collection('members').get()
]);

M.memberUids=snap.docs.map(d=>d.id);
M.members=snap.docs.map(d=>d.data().name);
M.memberPhones=snap.docs.map(d=>d.data().phone||'');
M.me=M.memberUids.indexOf(currentUid);

M.allMembers=allMembersSnap.docs.map(d=>({
  uid:d.id,
  name:d.data().name,
  status:d.data().status,
  joinedAt:d.data().joinedAt,
  leftAt:d.data().leftAt||null
}));

    say(T(
      'সদস্যকে সফলভাবে বিদায় দেওয়া হয়েছে। পুরোনো হিসাব সংরক্ষিত আছে।',
      'Member removed successfully. Previous records are preserved.'
    ));

    render();

  }catch(e){
    console.error('REMOVE MEMBER ERROR:',e);
    say(T(
      'সদস্যকে বিদায় দেওয়া যায়নি: '+(e.message||e.code),
      'Could not remove member: '+(e.message||e.code)
    ));
  }
}

async function changeMeal(i,delta){
  if(i!==M.me) return;

  const uid=M.memberUids[i];
  const ref=db.collection('messes')
    .doc(M.id)
    .collection('mealCounts')
    .doc(uid);

  const current=Number(M.meals[i])||0;
  const count=Math.max(0,current+delta);

  if(count===current) return;

  try{
    await ref.set({
      count:count,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
  }catch(e){
    console.error('MEAL SAVE ERROR:',e);
    say('মিল সংরক্ষণ হয়নি: '+(e.code||e.message));
  }
}
function dailyMealLocalDate(){

function dailyMealDraftKey(date,uid){
  return M.id+'_'+date+'_'+uid;
}

function dailyMealDraftValue(date,uid){
  const key=dailyMealDraftKey(date,uid);
  const saved=(M.dailyMeals||[]).find(x=>x.id===date+'_'+uid);
  const original=Number(saved?.count)||0;
  const drafts=window._smartMessDailyMealDrafts||(window._smartMessDailyMealDrafts={});
  return {
    original,
    count:Object.prototype.hasOwnProperty.call(drafts,key)
      ? drafts[key]
      : original,
    dirty:Object.prototype.hasOwnProperty.call(drafts,key)
      && drafts[key]!==original
  };
}

function changeDailyMeal(uid,delta){
  if(M.type!=='meal') return;

  const myUid=auth.currentUser.uid;
  if(uid!==myUid && M.role!=='admin')
    return say('অন্য সদস্যের মিল পরিবর্তনের অনুমতি নেই।');

  const date=document.getElementById('dailyMealDate')?.value||dailyMealLocalDate();
  const key=dailyMealDraftKey(date,uid);
  const state=dailyMealDraftValue(date,uid);
  const next=Math.max(0,state.count+delta);

  if(next===state.count) return;

  const drafts=window._smartMessDailyMealDrafts||(window._smartMessDailyMealDrafts={});
  drafts[key]=next;
  render();
}

async function saveDailyMeal(uid){
  if(M.type!=='meal') return;

  const myUid=auth.currentUser.uid;
  if(uid!==myUid && M.role!=='admin')
    return say('অন্য সদস্যের মিল পরিবর্তনের অনুমতি নেই।');

  const date=document.getElementById('dailyMealDate')?.value||dailyMealLocalDate();
  const key=dailyMealDraftKey(date,uid);
  const state=dailyMealDraftValue(date,uid);

  if(!state.dirty) return say('নতুন কোনো পরিবর্তন নেই।');

  try{
    await db.collection('messes')
      .doc(M.id)
      .collection('dailyMeals')
      .doc(date+'_'+uid)
      .set({
        uid:uid,
        date:date,
        count:state.count,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy:myUid
      },{merge:true});

    if(window._smartMessDailyMealDrafts)
      delete window._smartMessDailyMealDrafts[key];

    say('মিল সফলভাবে সেভ হয়েছে।');
    render();

  }catch(e){
    console.error('DAILY MEAL SAVE ERROR:',e);
    say('মিল সেভ হয়নি: '+(e.code||e.message));
  }
}

  async function toggleTask(id){

  try{

    const taskRef=db.collection('messes').doc(M.id)
      .collection('tasks').doc(id);

    const taskSnap=await taskRef.get();

    if(!taskSnap.exists){
      say('টাস্কটি পাওয়া যায়নি।');
      return;
    }

    const task=taskSnap.data();

    if(task.isDone===true){
      say('এই টাস্কটি ইতিমধ্যে সম্পন্ন হয়েছে।');
      return;
    }

    const now=new Date();

    const deleteAt=new Date(
      now.getTime()+(48*60*60*1000)
    );

    await taskRef.update({

      isDone:true,

      completedBy:auth.currentUser.uid,

      completedAt:firebase.firestore.Timestamp.fromDate(now),

      deleteAt:firebase.firestore.Timestamp.fromDate(deleteAt)

    });

    say('টাস্ক সম্পন্ন হয়েছে।');

  }catch(error){

    console.error('TASK UPDATE ERROR:',error);

    say('টাস্ক আপডেট করা যায়নি।');

  }
}

      return;
    }

    const quantity=prompt('পরিমাণ:',t.quantity||'');
    if(quantity===null)return;

    const note=prompt('অতিরিক্ত তথ্য:',t.note||'');
    if(note===null)return;

    // সম্পাদনার আগে আবার যাচাই
    const latestSnap=await taskRef.get();

    if(!latestSnap.exists||latestSnap.data().isDone===true){
      say('টাস্কটি ইতিমধ্যে সম্পন্ন হয়েছে।');
      return;
    }

    if(latestSnap.data().createdBy!==auth.currentUser.uid){
      say('শুধু নিজের টাস্ক এডিট করা যাবে।');
      return;
    }

    await taskRef.update({
      title:title.trim(),
      quantity:quantity.trim(),
      note:note.trim()
    });

    S.taskMenu=null;

    say('টাস্ক এডিট হয়েছে।');

  }catch(error){

    console.error('EDIT TASK ERROR:',error);

    say('টাস্ক এডিট করা যায়নি।');

  }
}


function render(){
  document.documentElement.lang=L;
  let v,nav='';
  if(S.screen=='auth')v=authView();else if(S.screen=='welcome')v=welcomeView();else if(S.screen=='create')v=createView();else if(S.screen=='join')v=joinView();
  else{
      const tabs=[['home','home',T('হোম','Home')],['add','add',T('খরচ যোগ','Add')],['expenses','receipt',T('খরচের তালিকা','Expenses')],['task','task',T('টাস্ক','Tasks')]].concat(M.type=='meal'?[['meal','meals',T('মিল','Meals')]]:[]);   
      v=({home:homeView,add:addView,meal:mealView,rep:reportView,task:taskView,req:reqView,expenses:expenseListView,members:memberListView,settings:settingsView,deposits:depositView,depositDetail:depositDetailView,history:historyView,historyDetail:historyDetailView,formerMembers:formerMembersView,about:aboutView,profile:profileView,editnumber:editNumberView,editname:editNameView}[S.tab]||homeView)();   
    nav=`<nav><div>${tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span class="sm-icon nav-icon i-${t[1]}"></span>${t[2]}</button>`).join('')}</div></nav>`;
  }
  document.getElementById('app').innerHTML=topbar()+v+nav+(S.view!=null&&M.exp[S.view]?`<div class="ov" onclick="S.view=null;render()"><img src="${M.exp[S.view].memo}" alt=""></div>`:'')+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}
render();
// PULL TO REFRESH
(function(){
  let startY=0;
  let pulling=false;
  let refreshing=false;
  const limit=75;
  const indicator=document.getElementById('pullRefresh');

  document.addEventListener('touchstart',e=>{
    if(refreshing || window.scrollY>0) return;
    startY=e.touches[0].clientY;
    pulling=true;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!pulling || refreshing) return;

    const distance=e.touches[0].clientY-startY;

    if(distance>0 && window.scrollY<=0){
      indicator.style.transform=
        `translate(-50%,${Math.min(distance-60,12)}px)`;
    }
  },{passive:true});

  document.addEventListener('touchend',async e=>{
    if(!pulling || refreshing) return;
    pulling=false;

    const distance=e.changedTouches[0].clientY-startY;

    if(distance<limit){
      indicator.style.transform='translate(-50%,-60px)';
      return;
    }

    if(!auth.currentUser || !M){
      indicator.style.transform='translate(-50%,-60px)';
      return;
    }

    refreshing=true;
    indicator.classList.add('loading');


    try{
      await after();
      if(M) S.tab='home';
      render();
      say(T('ডাটা আপডেট হয়েছে','Data refreshed'));
    }catch(err){
      console.error('REFRESH ERROR:',err);
      say(T('ডাটা আপডেট করা যায়নি','Refresh failed'));
    }finally{
      refreshing=false;
      indicator.classList.remove('loading');
      indicator.style.transform='translate(-50%,-60px)';
    }
  },{passive:true});
})();


function hideSplash(){
  setTimeout(()=>{
    const splash=document.getElementById('splash');
    if(splash) splash.remove();
  },1200);
}

auth.onAuthStateChanged(async user=>{
  
  if(user){
    S.user={
      uid:user.uid,
      name:user.displayName||user.email.split('@')[0],
      email:user.email
    };

    await after();
    hideSplash();

  }else{

  // Auth signed-out হলে সব Listener বন্ধ করুন.
  stopMessListeners();

  S.user=null;
  M=null;
  S.members=[];
  S.screen='auth';

  render();
  hideSplash();
}
});
const App = window.SmartMessApp;

if(App){
 App.addListener('backButton',()=>{
  if(NAV_HISTORY.length){
   goBack();
   return;
  }

  const exitMsg = L === 'bn'
 ? 'আপনি কি Smart Mess অ্যাপ থেকে বের হতে চান?'
 : 'Do you want to exit Smart Mess?';

if(confirm(exitMsg)){
   App.exitApp();
}
 });
}

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0fff7"><title>Smart Mess</title>
<style>
:root{--bg:#f0fff7;--green:#168653;--dark:#125b3d;--mint:#dff7e9;--ink:#17352a;--muted:#71857b;--white:#fff;--red:#d84b4b;--line:#e4eee8;--shadow:0 8px 28px #164b2b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:620px;margin:auto;min-height:100dvh;padding:16px 15px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--dark);font-size:20px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px}.lang{background:white;border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--dark)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}h1{font-size:23px;margin:10px 0 5px}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:23px;color:var(--dark);margin-top:5px}.btn{background:var(--green);color:#fff;border-radius:12px;padding:12px 15px;font-weight:700;width:100%;margin-top:8px}.btn.secondary{background:var(--mint);color:var(--dark)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{width:auto;padding:7px 10px;margin:0;font-size:13px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #dce9e1;border-radius:11px;background:#fff;color:var(--ink)}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.tabsin{width:min(620px,100%);display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom))}.tab{background:none;color:var(--muted);font-size:11px;padding:4px 7px;min-width:55px}.tab span{display:block;font-size:20px;margin-bottom:2px}.tab.active{color:var(--green);font-weight:800}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.pill{background:var(--mint);color:var(--dark);padding:4px 9px;border-radius:30px;font-size:12px}.notice{background:#fff8df;border:1px solid #f2e4ae;padding:12px;border-radius:12px;font-size:13px;line-height:1.55}.hidden{display:none!important}.center{text-align:center}.logo{width:88px;height:88px;object-fit:contain}.dots{display:flex;gap:10px;justify-content:center;margin:20px}.dots i{width:11px;height:11px;border-radius:50%;background:#e64b4b;animation:orbit 1.1s infinite alternate}.dots i:nth-child(2){background:#e8b83f;animation-delay:.2s}.dots i:nth-child(3){background:#249b68;animation-delay:.4s}@keyframes orbit{to{transform:translateY(-9px)}}.error{color:var(--red);font-size:13px}.menu{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;text-align:left;margin:5px 0;color:var(--ink)}.menu .ico{display:inline-block;width:34px;font-size:20px}.setico{width:25px;height:25px;object-fit:contain;vertical-align:middle;margin-right:9px}.balance{font-size:27px;font-weight:800;color:var(--dark)}.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
</style>
</head>
<body><main class="app" id="app"><section class="center card"><img class="logo" src="logo.png" onerror="this.style.display='none'"><h1>Smart Mess</h1><div class="dots"><i></i><i></i><i></i></div><p class="muted">লোড হচ্ছে…</p></section></main><nav class="tabs hidden" id="tabs"><div class="tabsin" id="tabsin"></div></nav>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig = {
  apiKey: "AIzaSyDE2DGvU1xDVlQC_-_R1hG7SifwbnCN21g",
  authDomain: "smart-mess-294f3.firebaseapp.com",
  projectId: "smart-mess-294f3",
  storageBucket: "smart-mess-294f3.firebasestorage.app",
  messagingSenderId: "1009030541190",
  appId: "1:1009030541190:web:c0bbf5f9c054338dc8c607"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue;
const $=id=>document.getElementById(id), app=$('app');
let user=null, profile=null, mess=null, member=null, period=null, periodId=null, members=[], expenses=[], deposits=[], meals=[], notices=[], history=[], page='home', lang=localStorage.getItem('sm_lang')||'bn', unsubs=[];
const t=(bn,en)=>lang==='bn'?bn:en, money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})+' '+(mess?.currency||'SAR'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>user?.uid, admin=()=>member?.role==='admin', active=()=>member?.status==='active';
const dateKey=()=>new Date().toISOString().slice(0,10), monthKey=()=>dateKey().slice(0,7), id=()=>Math.random().toString(36).slice(2,10).toUpperCase();
function msg(s){alert(s)} function fail(e){console.error(e);msg(e?.message||'কাজটি সম্পন্ন হয়নি। আবার চেষ্টা করুন।')}
function busy(btn,on){if(!btn)return;btn.disabled=on;btn.dataset.old??=btn.textContent;btn.textContent=on?'অপেক্ষা করুন…':btn.dataset.old}
function clearSubs(){unsubs.forEach(f=>f&&f());unsubs=[]}
function base(){return db.collection('sm_v2').doc('messes').collection(mess.id)}
function pbase(){return base().doc('periods').collection(periodId)}
function setTabs(){const list=[['home','🏠','হোম'],['meals','🍽️','মিল'],['expenses','🧾','খরচ'],['report','📊','হিসাব'],['settings','⚙️','সেটিংস']];$('tabs').classList.remove('hidden');$('tabsin').innerHTML=list.map(([k,i,n])=>`<button class="tab ${page===k?'active':''}" onclick="go('${k}')"><span>${i}</span>${t(n,({হোম:'Home',মিল:'Meals',খরচ:'Expenses',হিসাব:'Report',সেটিংস:'Settings'})[n])}</button>`).join('')}
function shell(title,body){app.innerHTML=`<header class="top"><div class="brand"><img src="logo.png" onerror="this.style.display='none'">Smart Mess</div><button class="lang" onclick="toggleLang()">${lang==='bn'?'EN':'বাংলা'}</button></header><h1>${title}</h1>${body}`}
function toggleLang(){lang=lang==='bn'?'en':'bn';localStorage.setItem('sm_lang',lang);render()}
function go(p){page=p;render();if(p==='history')loadHistory()}
function stopAll(){clearSubs();$('tabs').classList.add('hidden')}
function authView(){stopAll();app.innerHTML=`<header class="top"><div class="brand"><img src="logo.png" onerror="this.style.display='none'">Smart Mess</div><button class="lang" onclick="toggleLang()">${lang==='bn'?'EN':'বাংলা'}</button></header><section class="card"><h1>${t('স্বাগতম','Welcome')}</h1><p class="muted">${t('আপনার মেসের হিসাব, এক জায়গায়','Your mess accounts in one place')}</p><div id="autherr" class="error"></div><div class="field"><label>${t('ইমেইল','Email')}</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>${t('পাসওয়ার্ড','Password')}</label><input id="pass" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">${t('লগইন','Login')}</button><button class="btn secondary" onclick="signupView()">${t('নতুন অ্যাকাউন্ট খুলুন','Create account')}</button><button class="btn secondary" onclick="resetPass()">${t('পাসওয়ার্ড ভুলে গেছেন?','Forgot password?')}</button></section>`}
function signupView(){app.innerHTML=`<header class="top"><div class="brand">Smart Mess</div><button class="lang" onclick="authView()">← ${t('ফিরে যান','Back')}</button></header><section class="card"><h1>${t('অ্যাকাউন্ট তৈরি','Create account')}</h1><div id="autherr" class="error"></div><div class="field"><label>${t('আপনার নাম','Your name')}</label><input id="name"></div><div class="field"><label>${t('মোবাইল নম্বর','Mobile number')}</label><input id="phone" type="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>${t('পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)','Password (at least 6 characters)')}</label><input id="pass" type="password"></div><button class="btn" onclick="signup()">${t('অ্যাকাউন্ট তৈরি করুন','Create account')}</button></section>`}
async function login(){try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)}catch(e){$('autherr').textContent=e.message}}
async function signup(){try{const name=$('name').value.trim(),phone=$('phone').value.trim();if(!name)throw Error('নাম লিখুন');const c=await auth.createUserWithEmailAndPassword($('email').value.trim(),$('pass').value);await c.user.updateProfile({displayName:name});await db.collection('sm_v2').doc('profiles').collection('users').doc(c.user.uid).set({uid:c.user.uid,name,phone,email:c.user.email,createdAt:FV.serverTimestamp(),messId:null});}catch(e){$('autherr').textContent=e.message}}
async function resetPass(){const email=$('email')?.value.trim();if(!email)return msg('আগে ইমেইল লিখুন');try{await auth.sendPasswordResetEmail(email);msg('পাসওয়ার্ড রিসেট ইমেইল পাঠানো হয়েছে।')}catch(e){fail(e)}}
async function afterAuth(u){stopAll();user=u;if(!u){profile=null;mess=null;member=null;authView();return}const ps=await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).get();profile=ps.exists?ps.data():null;if(!profile){await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).set({uid:uid(),name:u.displayName||u.email.split('@')[0],phone:'',email:u.email,messId:null,createdAt:FV.serverTimestamp()});profile=(await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).get()).data()}if(profile.messId){await loadMess(profile.messId)}else{lobby()}}
function lobby(){stopAll();const pr=db.collection('sm_v2').doc('profiles').collection('users').doc(uid());unsubs.push(pr.onSnapshot(s=>{const d=s.data();if(d?.messId&&!mess){profile=d;loadMess(d.messId).catch(fail)}}));app.innerHTML=`<header class="top"><div class="brand">Smart Mess</div><button class="lang" onclick="toggleLang()">${lang==='bn'?'EN':'বাংলা'}</button></header><section class="card"><h1>${t('মেস তৈরি বা যোগ দিন','Create or join a mess')}</h1><div class="field"><label>${t('মেসের নাম','Mess name')}</label><input id="messname" placeholder="যেমন: আল-নূর মেস"></div><div class="field"><label>${t('মুদ্রা','Currency')}</label><select id="currency"><option>SAR</option><option>BDT</option><option>USD</option></select></div><button class="btn" onclick="createMess()">${t('নতুন মেস তৈরি করুন','Create new mess')}</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="field"><label>${t('মেস কোড','Mess code')}</label><input id="joincode" maxlength="8"></div><button class="btn secondary" onclick="requestJoin()">${t('কোড দিয়ে যোগ দিন','Request to join')}</button><button class="btn danger" onclick="logout()">${t('লগআউট','Log out')}</button></section>`}
async function createMess(){try{const name=$('messname').value.trim();if(!name)throw Error('মেসের নাম লিখুন');const messId=id(),code=id().slice(0,6),pid=monthKey();const b=db.collection('sm_v2').doc('messes').collection(messId);const batch=db.batch();batch.set(b.doc('meta'),{name,currency:$('currency').value,adminUid:uid(),activePeriodId:pid,code,createdAt:FV.serverTimestamp(),status:'active'});batch.set(b.collection('members').doc(uid()),{uid:uid(),name:profile.name,phone:profile.phone||'',role:'admin',status:'active',joinedAt:FV.serverTimestamp()});batch.set(b.collection('periods').doc(pid),{month:pid,createdAt:FV.serverTimestamp(),status:'active',createdBy:uid()});batch.set(db.collection('sm_v2').doc('codes').collection('items').doc(code),{messId,createdAt:FV.serverTimestamp()});batch.update(db.collection('sm_v2').doc('profiles').collection('users').doc(uid()),{messId});await batch.commit();profile.messId=messId;await loadMess(messId)}catch(e){fail(e)}}
async function requestJoin(){try{const code=$('joincode').value.trim().toUpperCase();const c=await db.collection('sm_v2').doc('codes').collection('items').doc(code).get();if(!c.exists)throw Error('মেস কোড পাওয়া যায়নি');const messId=c.data().messId;await db.collection('sm_v2').doc('messes').collection(messId).collection('requests').doc(uid()).set({uid:uid(),name:profile.name,email:user.email,phone:profile.phone||'',status:'pending',createdAt:FV.serverTimestamp()});msg('যোগদানের অনুরোধ পাঠানো হয়েছে। অ্যাডমিন অনুমোদন করলে যুক্ত হবেন।')}catch(e){fail(e)}}
async function loadMess(mid){clearSubs();const b=db.collection('sm_v2').doc('messes').collection(mid),m=await b.doc('meta').get();if(!m.exists){await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).update({messId:null});profile.messId=null;lobby();return}mess={id:mid,...m.data()};const ms=await b.collection('members').doc(uid()).get();if(!ms.exists||ms.data().status!=='active'){profile.messId=null;await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).update({messId:null});lobby();return}member=ms.data();periodId=mess.activePeriodId;const p=await b.collection('periods').doc(periodId).get();period=p.data();subscribeData();page='home';render()}
function subscribeData(){const b=db.collection('sm_v2').doc('messes').collection(mess.id);unsubs.push(b.collection('members').where('status','==','active').onSnapshot(s=>{members=s.docs.map(d=>d.data());render()}));const p=b.collection('periods').doc(periodId);unsubs.push(p.collection('expenses').orderBy('createdAt','desc').onSnapshot(s=>{expenses=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(p.collection('deposits').orderBy('createdAt','desc').onSnapshot(s=>{deposits=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(p.collection('meals').orderBy('date','desc').limit(300).onSnapshot(s=>{meals=s.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(b.collection('notifications').where('toUid','==',uid()).onSnapshot(s=>{notices=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)).slice(0,30);if(page==='notifications')render()}))}
function render(){if(!user)return; if(!mess){lobby();return}setTabs();const titles={requests:'যোগদানের অনুরোধ',home:t('ড্যাশবোর্ড','Dashboard'),meals:t('দৈনিক মিল','Daily meals'),expenses:t('খরচের তালিকা','Expenses'),addExpense:t('খরচ যোগ করুন','Add expense'),report:t('মাসিক হিসাব','Monthly report'),deposits:t('জমা','Deposits'),members:t('সদস্য তালিকা','Members'),settings:t('সেটিংস','Settings'),history:t('আগের হিসাব','History'),notifications:t('নোটিফিকেশন','Notifications'),about:t('ডেভেলপার পরিচিতি','About developer')};const views={home:homeView,meals:mealsView,expenses:expensesView,addExpense:addExpenseView,report:reportView,deposits:depositsView,members:membersView,settings:settingsView,history:historyView,requests:requestsView,notifications:notificationsView,about:aboutView};shell(titles[page]||'Smart Mess',(views[page]||homeView)());if(page==='requests')loadRequests()}
function totalExpense(){return expenses.reduce((s,x)=>s+Number(x.amount||0),0)}function totalDeposit(){return deposits.reduce((s,x)=>s+Number(x.amount||0),0)}function fundSpent(){return expenses.filter(x=>x.source==='fund').reduce((s,x)=>s+Number(x.amount||0),0)}function fundBalance(){return totalDeposit()-fundSpent()}
function copyCode(){if(!mess?.code)return; navigator.clipboard?.writeText(mess.code).then(()=>msg('মেস কোড কপি হয়েছে।')).catch(()=>msg('মেস কোড: '+mess.code))}
function homeView(){return `<div class="grid"><div class="stat"><span class="muted">${t('মোট খরচ','Total expense')}</span><b>${money(totalExpense())}</b></div><div class="stat"><span class="muted">${t('সদস্য','Members')}</span><b>${members.length}</b></div><div class="stat"><span class="muted">${t('মাথাপিছু খরচ','Per head')}</span><b>${money(members.length?totalExpense()/members.length:0)}</b></div><div class="stat"><span class="muted">${t('ফান্ড ব্যালেন্স','Fund balance')}</span><b>${money(fundBalance())}</b></div></div><div class="notice" style="margin-top:12px">📢 ফান্ডের টাকা দিয়ে বাজার করলে: অ্যাডমিন অথবা অন্য কোনো সদস্য ফান্ডের টাকা দিয়ে বাজার করলে, সেই খরচের হিসাব অ্যাডমিন এন্ট্রি করবেন। এটি কোনো সদস্যের ব্যক্তিগত জমা বা পাওনা হিসেবে গণনা হবে না।</div><div class="card"><div class="split"><h2>${esc(mess.name)}</h2><span class="pill">${admin()?'Admin':'Member'}</span></div><p class="muted">${t('মেস কোড','Mess code')}: <b>${esc(mess.code||'কোড পাওয়া যায়নি')}</b> <button class="btn small secondary" onclick="copyCode()">কপি</button></p><div class="row"><button class="btn secondary" onclick="go('addExpense')">＋ ${t('খরচ যোগ','Add expense')}</button><button class="btn secondary" onclick="go('deposits')">＋ ${t('জমা যোগ','Add deposit')}</button></div><button class="btn secondary" onclick="go('notifications')">🔔 ${t('নোটিফিকেশন','Notifications')} (${notices.length})</button></div>`}
function mealsView(){const today=dateKey(),todayRows=meals.filter(x=>x.date===today);return `<div class="card"><h2>${t('আজকের মিল','Today’s meals')} · ${today}</h2>${members.map(m=>{const r=todayRows.find(x=>x.uid===m.uid);const n=Number(r?.count||0);return `<div class="item"><div><b>${esc(m.name)}</b><div class="muted">${m.uid===uid()?t('আপনার মিল','Your meals'):''}</div></div><div class="row" style="flex:0 0 auto"><button class="btn small secondary" onclick="changeMeal(-1)" ${m.uid!==uid()?'disabled':''}>−</button><b>${n}</b><button class="btn small" onclick="changeMeal(1)" ${m.uid!==uid()?'disabled':''}>＋</button></div></div>`}).join('')}</div><p class="muted">${t('প্রত্যেক সদস্য শুধু নিজের মিল পরিবর্তন করতে পারবেন।','Each member can change only their own meal count.')}</p>`}
async function changeMeal(delta){try{const date=dateKey(),ref=pbase().collection('meals').doc(uid()+'_'+date),snap=await ref.get(),count=Math.max(0,Number(snap.data()?.count||0)+delta);await ref.set({uid:uid(),name:member.name,date,count,updatedAt:FV.serverTimestamp(),updatedBy:uid()},{merge:true})}catch(e){fail(e)}}
const cats=[['veg','🥬','সবজি'],['fish','🐟','মাছ'],['chk','🍗','মুরগি'],['meat','🥩','মাংস'],['egg','🥚','ডিম'],['rice','🍚','চাল'],['dal','🫘','ডাল'],['other','📦','অন্যান্য']];
function expensesView(){return `<div class="card"><div class="split"><h2>${t('খরচের তালিকা','Expense list')}</h2><button class="btn small" onclick="go('addExpense')">＋ ${t('যোগ','Add')}</button></div>${expenses.length?expenses.map(x=>`<div class="item"><div><b>${esc(x.item)}</b><div class="muted">${esc(x.date)} · ${esc(x.payerName||'')} · ${x.source==='fund'?'ফান্ড':'নিজের পকেট'}</div></div><div style="text-align:right"><b>${money(x.amount)}</b><button class="btn small secondary" onclick="expenseMenu('${x.id}')">⋮</button></div></div>`).join(''):'<p class="muted">এখনো কোনো খরচ নেই।</p>'}</div>`}
function addExpenseView(){return `<section class="card"><div class="field"><label>${t('খরচের ধরন','Category')}</label><select id="ecat" onchange="toggleOther()">${cats.map(c=>`<option value="${c[0]}">${c[1]} ${c[2]}</option>`).join('')}</select></div><div class="field"><label>${t('পণ্যের নাম / বিবরণ','Item name / description')}</label><input id="eitem" placeholder="যেমন: পেঁয়াজ, চাল, বাজার"></div><div class="field"><label>${t('টাকার পরিমাণ','Amount')}</label><input id="eamount" type="number" min="0.01" step="0.01"></div><div class="field"><label>${t('টাকা দিয়েছেন','Paid by')}</label><select id="epayer" ${!admin()?'disabled':''}>${members.map(m=>`<option value="${m.uid}" ${m.uid===uid()?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>${t('টাকার উৎস','Payment source')}</label><select id="esource"><option value="fund">মেস ফান্ড</option><option value="personal">নিজের পকেট</option></select></div><div class="field"><label>${t('তারিখ','Date')}</label><input id="edate" type="date" value="${dateKey()}"></div><button class="btn" onclick="saveExpense()">${t('খরচ সংরক্ষণ','Save expense')}</button><button class="btn secondary" onclick="go('expenses')">${t('বাতিল','Cancel')}</button></section>`}
function toggleOther(){}
async function saveExpense(){try{const item=$('eitem').value.trim(),amount=Number($('eamount').value),payerUid=$('epayer').value,source=$('esource').value,date=$('edate').value;if(!item||!Number.isFinite(amount)||amount<=0||!date)throw Error('নাম, সঠিক পরিমাণ ও তারিখ দিন');const payer=members.find(m=>m.uid===payerUid);if(!payer)throw Error('সদস্য পাওয়া যায়নি');const ref=pbase().collection('expenses').doc();await ref.set({item,category:$('ecat').value,amount,payerUid,payerName:payer.name,source,date,createdBy:uid(),createdByName:member.name,createdAt:FV.serverTimestamp(),updatedAt:FV.serverTimestamp()});await notifyOthers('expense_added',`${member.name} একটি খরচ যোগ করেছেন`);go('expenses')}catch(e){fail(e)}}
async function expenseMenu(eid){const x=expenses.find(z=>z.id===eid);if(!x)return;const choice=prompt('1 = সম্পাদনা, 2 = মুছুন, অন্য কিছু = বাতিল');if(choice==='2'){if(!confirm('এই খরচ মুছবেন?'))return;try{await pbase().collection('expenses').doc(eid).delete();await notifyOthers('expense_deleted',`${member.name} একটি খরচ মুছে দিয়েছেন`)}catch(e){fail(e)}}else if(choice==='1'){const item=prompt('পণ্যের নাম',x.item),amount=Number(prompt('পরিমাণ',x.amount));if(item===null||!item.trim()||!amount||amount<=0)return;try{await pbase().collection('expenses').doc(eid).update({item:item.trim(),amount,updatedAt:FV.serverTimestamp(),updatedBy:uid()});await notifyOthers('expense_updated',`${member.name} একটি খরচ সম্পাদনা করেছেন`)}catch(e){fail(e)}}}
async function notifyOthers(type,textMsg){const batch=db.batch(),b=db.collection('sm_v2').doc('messes').collection(mess.id).collection('notifications');members.filter(m=>m.uid!==uid()).forEach(m=>batch.set(b.doc(),{toUid:m.uid,type,text:textMsg,createdBy:uid(),createdAt:FV.serverTimestamp(),read:false}));await batch.commit()}
function depositsView(){return `<section class="card"><h2>${t('নতুন জমা','Add deposit')}</h2><div class="field"><label>${t('সদস্য','Member')}</label><select id="duid">${members.map(m=>`<option value="${m.uid}" ${m.uid===uid()?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>${t('পরিমাণ','Amount')}</label><input id="damount" type="number" min=".01" step=".01"></div><div class="field"><label>${t('তারিখ','Date')}</label><input id="ddate" type="date" value="${dateKey()}"></div><button class="btn" onclick="saveDeposit()">জমা সংরক্ষণ</button></section><section class="card"><h2>${t('জমার তালিকা','Deposits')}</h2>${deposits.map(d=>`<div class="item"><span>${esc(d.memberName)} · ${esc(d.date)}</span><b>${money(d.amount)}</b></div>`).join('')||'<p class="muted">কোনো জমা নেই।</p>'}</section>`}
async function saveDeposit(){try{const target=$('duid').value,amount=Number($('damount').value),date=$('ddate').value;if(amount<=0||!date)throw Error('সঠিক পরিমাণ ও তারিখ দিন');if(target!==uid()&&!admin())throw Error('অন্য সদস্যের জমা যোগ করতে অ্যাডমিন হতে হবে');const m=members.find(x=>x.uid===target);await pbase().collection('deposits').add({uid:target,memberName:m.name,amount,date,createdBy:uid(),createdAt:FV.serverTimestamp()});msg('জমা সংরক্ষণ হয়েছে।')}catch(e){fail(e)}}
function reportView(){const n=members.length,share=n?totalExpense()/n:0;const rows=members.map(m=>{const dep=deposits.filter(d=>d.uid===m.uid).reduce((s,d)=>s+Number(d.amount),0),personal=expenses.filter(x=>x.source==='personal'&&x.payerUid===m.uid).reduce((s,x)=>s+Number(x.amount),0),contrib=dep+personal,net=contrib-share;return {m,dep,personal,contrib,net}});const debtors=rows.filter(x=>x.net<-.005),creditors=rows.filter(x=>x.net>.005);return `<div class="grid"><div class="stat"><span class="muted">মোট খরচ</span><b>${money(totalExpense())}</b></div><div class="stat"><span class="muted">মাথাপিছু</span><b>${money(share)}</b></div><div class="stat"><span class="muted">মোট জমা</span><b>${money(totalDeposit())}</b></div><div class="stat"><span class="muted">ফান্ড ব্যালেন্স</span><b>${money(fundBalance())}</b></div></div><section class="card"><h2>সদস্যভিত্তিক হিসাব</h2>${rows.map(x=>`<div class="item"><div><b>${esc(x.m.name)}</b><div class="muted">জমা ${money(x.dep)} · নিজের পকেট ${money(x.personal)}</div></div><div style="text-align:right"><b style="color:${x.net<-.005?'var(--red)':'var(--green)'}">${x.net<-.005?'দেবে':'পাবে'} ${money(Math.abs(x.net))}</b></div></div>`).join('')}</section><section class="card"><h2>সেটেলমেন্ট তালিকা</h2>${settlement(debtors,creditors)}</section><p class="muted">হিসাবের সূত্র: সদস্যের জমা + নিজের পকেট থেকে দেওয়া সাধারণ খরচ − মাথাপিছু মোট খরচ। ফান্ড থেকে করা খরচ ব্যক্তিগত পাওনা হিসেবে ধরা হয় না।</p>`}
function settlement(ds,cs){let out=[],a=ds.map(x=>({name:x.m.name,v:-x.net})),b=cs.map(x=>({name:x.m.name,v:x.net})),i=0,j=0;while(i<a.length&&j<b.length){const v=Math.min(a[i].v,b[j].v);if(v>.005)out.push(`<div class="item"><span>${esc(a[i].name)} → ${esc(b[j].name)}</span><b>${money(v)}</b></div>`);a[i].v-=v;b[j].v-=v;if(a[i].v<.005)i++;if(b[j].v<.005)j++}return out.join('')||'<p class="muted">কোনো বকেয়া সেটেলমেন্ট নেই।</p>'}
function membersView(){return `<section class="card"><h2>সদস্য তালিকা</h2>${members.map(m=>`<div class="item"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.phone||'মোবাইল নম্বর যোগ করেননি')} · ${m.role==='admin'?'Admin':'Member'}</div></div>${admin()&&m.uid!==uid()?`<button class="btn small secondary" onclick="memberAction('${m.uid}')">⋮</button>`:''}</div>`).join('')}</section>`}
async function memberAction(mid){const c=prompt('1 = অ্যাডমিন করুন, 2 = সদস্য সরান');try{const b=db.collection('sm_v2').doc('messes').collection(mess.id);if(c==='1'){if(!confirm('অ্যাডমিন দায়িত্ব হস্তান্তর করবেন?'))return;const batch=db.batch();batch.update(b.collection('members').doc(mid),{role:'admin'});batch.update(b.collection('members').doc(uid()),{role:'member'});batch.update(b.doc('meta'),{adminUid:mid});await batch.commit();member.role='member';msg('অ্যাডমিন পরিবর্তন হয়েছে।')}else if(c==='2'){if(!confirm('সদস্যকে সরাবেন?'))return;await b.collection('members').doc(mid).update({status:'removed'})}}catch(e){fail(e)}}
function settingsView(){return `<section class="card"><button class="menu" onclick="editProfile('name')"><img class="setico" src="icons/user.png" alt="">নাম পরিবর্তন</button><button class="menu" onclick="editProfile('phone')"><img class="setico" src="icons/phone.png" alt="">মোবাইল নম্বর</button><button class="menu" onclick="go('members')"><img class="setico" src="icons/members.png" alt="">সদস্য তালিকা</button><button class="menu" onclick="renameMess()"><img class="setico" src="icons/house.png" alt="">মেসের নাম পরিবর্তন</button><button class="menu" onclick="go('history')"><img class="setico" src="icons/history.png" alt="">আগের হিসাব</button>${admin()?`<button class="menu" onclick="go('requests')"><img class="setico" src="icons/requests.png" alt="">যোগদানের অনুরোধ</button><button class="menu" onclick="resetMess()"><img class="setico" src="icons/reset.png" alt="">মেস রিসেট</button>`:''}<button class="menu" onclick="leaveMess()"><img class="setico" src="icons/leave.png" alt="">মেস ত্যাগ</button><button class="menu" onclick="go('about')"><img class="setico" src="icons/about.png" alt="">ডেভেলপার পরিচিতি</button><button class="menu" onclick="logout()"><img class="setico" src="icons/logout.png" alt="">লগআউট</button></section>`}
async function editProfile(k){const label=k==='name'?'নতুন নাম':'মোবাইল নম্বর',v=prompt(label,profile[k]||'');if(v===null||!v.trim())return;try{await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).update({[k]:v.trim()});profile[k]=v.trim();await db.collection('sm_v2').doc('messes').collection(mess.id).collection('members').doc(uid()).update({[k]:v.trim()});member[k]=v.trim();render()}catch(e){fail(e)}}
async function renameMess(){if(!admin())return;const v=prompt('নতুন মেসের নাম',mess.name);if(!v?.trim())return;try{await db.collection('sm_v2').doc('messes').collection(mess.id).doc('meta').update({name:v.trim()});mess.name=v.trim();render()}catch(e){fail(e)}}
async function leaveMess(){if(!confirm('মেস ত্যাগ করতে চান?'))return;try{if(admin())throw Error('মেস ছাড়ার আগে অন্য একজনকে অ্যাডমিন দায়িত্ব দিন।');const b=db.collection('sm_v2').doc('messes').collection(mess.id);await b.collection('members').doc(uid()).update({status:'left'});await db.collection('sm_v2').doc('profiles').collection('users').doc(uid()).update({messId:null});profile.messId=null;mess=null;member=null;lobby()}catch(e){fail(e)}}
async function resetMess(){if(!admin()||!confirm('নতুন হিসাব শুরু হবে। পুরোনো হিসাব ৩ মাসের ইতিহাসে থাকবে। চালিয়ে যাবেন?'))return;try{const old=periodId,newId=monthKey()+'-'+id().slice(0,4),b=db.collection('sm_v2').doc('messes').collection(mess.id),batch=db.batch();batch.update(b.collection('periods').doc(old),{status:'archived',archivedAt:FV.serverTimestamp(),expiresAt:firebase.firestore.Timestamp.fromDate(new Date(Date.now()+90*86400000))});batch.set(b.collection('periods').doc(newId),{month:monthKey(),createdAt:FV.serverTimestamp(),createdBy:uid(),status:'active'});batch.update(b.doc('meta'),{activePeriodId:newId});await batch.commit();periodId=newId;period={month:monthKey()};expenses=[];deposits=[];meals=[];subscribeData();go('home');msg('নতুন হিসাব শুরু হয়েছে।')}catch(e){fail(e)}}
function historyView(){return `<section class="card"><h2>সর্বশেষ ৩টি পুরোনো হিসাব</h2>${history.map(h=>`<div class="item"><div><b>${esc(h.month||h.id)}</b><div class="muted">আর্কাইভ করা হয়েছে</div></div><button class="btn small secondary" onclick="openHistory('${h.id}')">দেখুন</button></div>`).join('')||'<p class="muted">এখনো কোনো ইতিহাস নেই।</p>'}</section>`}
async function loadHistory(){try{const b=db.collection('sm_v2').doc('messes').collection(mess.id);const s=await b.collection('periods').get();history=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='archived').sort((a,b)=>(b.archivedAt?.toMillis?.()||0)-(a.archivedAt?.toMillis?.()||0)).slice(0,3);if(page==='history')render()}catch(e){fail(e)}}
function requestsView(){return `<section class="card"><h2>সদস্য হওয়ার অনুরোধ</h2><div id="requestlist">লোড হচ্ছে…</div></section>`}
async function loadRequests(){try{const b=db.collection('sm_v2').doc('messes').collection(mess.id);const s=await b.collection('requests').where('status','==','pending').get();const el=$('requestlist');if(!el)return;el.innerHTML=s.empty?'<p class="muted">কোনো অপেক্ষমাণ অনুরোধ নেই।</p>':s.docs.map(d=>{const r=d.data();return `<div class="item"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.email||'')} · ${esc(r.phone||'')}</div></div><div><button class="btn small" onclick="decideRequest('${d.id}','approved')">অনুমোদন</button><button class="btn small danger" onclick="decideRequest('${d.id}','rejected')">বাতিল</button></div></div>`}).join('')}catch(e){fail(e)}}
async function decideRequest(target,status){try{const b=db.collection('sm_v2').doc('messes').collection(mess.id),rref=b.collection('requests').doc(target),rs=await rref.get();if(!rs.exists||rs.data().status!=='pending')throw Error('অনুরোধটি আর অপেক্ষমাণ নেই');const r=rs.data(),batch=db.batch();batch.update(rref,{status,decidedAt:FV.serverTimestamp(),decidedBy:uid()});if(status==='approved'){batch.set(b.collection('members').doc(target),{uid:target,name:r.name,phone:r.phone||'',role:'member',status:'active',joinedAt:FV.serverTimestamp()});batch.update(db.collection('sm_v2').doc('profiles').collection('users').doc(target),{messId:mess.id});}await batch.commit();await loadRequests();msg(status==='approved'?'সদস্য সফলভাবে যুক্ত হয়েছে।':'অনুরোধ বাতিল করা হয়েছে।')}catch(e){fail(e)}}
async function openHistory(hid){try{const p=db.collection('sm_v2').doc('messes').collection(mess.id).collection('periods').doc(hid);const [e,d]=await Promise.all([p.collection('expenses').get(),p.collection('deposits').get()]);const ex=e.docs.map(x=>x.data()),de=d.docs.map(x=>x.data());msg(`পুরোনো হিসাব ${hid}\nমোট খরচ: ${money(ex.reduce((s,x)=>s+Number(x.amount),0))}\nমোট জমা: ${money(de.reduce((s,x)=>s+Number(x.amount),0))}\nখরচের রেকর্ড: ${ex.length}`)}catch(e){fail(e)}}
function notificationsView(){return `<section class="card">${notices.map(n=>`<div class="item"><div>${esc(n.text)}<div class="muted">${n.createdAt?.toDate?n.createdAt.toDate().toLocaleString():''}</div></div></div>`).join('')||'<p class="muted">নতুন নোটিফিকেশন নেই।</p>'}</section>`}
function aboutView(){return `<section class="card center"><img src="logo.png" style="width:90px;height:90px;object-fit:contain"><h2>Smart Mess</h2><p>মেসের হিসাব হোক সহজ, স্বচ্ছ ও সবার জন্য এক জায়গায়।</p><p class="muted">Smart Mess — Simple, transparent mess management.</p><p class="muted">Developer information will be added here.</p></section>`}
auth.onAuthStateChanged(u=>afterAuth(u).catch(fail));
async function logout(){try{stopAll();await auth.signOut()}catch(e){fail(e)}}
window.copyCode=copyCode;window.login=login;window.signup=signup;window.signupView=signupView;window.resetPass=resetPass;window.createMess=createMess;window.requestJoin=requestJoin;window.go=go;window.toggleLang=toggleLang;window.changeMeal=changeMeal;window.saveExpense=saveExpense;window.expenseMenu=expenseMenu;window.saveDeposit=saveDeposit;window.memberAction=memberAction;window.editProfile=editProfile;window.renameMess=renameMess;window.leaveMess=leaveMess;window.resetMess=resetMess;window.openHistory=openHistory;window.loadRequests=loadRequests;window.decideRequest=decideRequest;window.logout=logout;window.toggleOther=toggleOther;
</script></body></html>

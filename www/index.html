  /* SMART MESS SPLASH SCREEN */
#splash{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#f0fff7;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.splash-logo{
  width:200px;
  height:200px;
  object-fit:contain;
  z-index:2;
}

#splash::before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  border:2px dashed #218b50;
  border-radius:50%;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
}

.splash-orbit{
  position:absolute;
  top:45%;
  left:50%;
  width:250px;
  height:250px;
  margin:-125px 0 0 -125px;
  animation:orbit 5s linear infinite;
  z-index:3;
  pointer-events:none;
}
  .splash-dot{
  position:absolute;
  top:50%;
  left:50%;
  width:13px;
  height:13px;
  border-radius:50%;
  box-shadow:0 0 12px currentColor;
  transform:translate(-50%,-50%) rotate(0deg) translateY(-125px);
}

.dot-red{
  color:#ff3030;
  background:#ff3030;
}

.dot-blue{
  color:#2196f3;
  background:#2196f3;
  transform:translate(-50%,-50%) rotate(120deg) translateY(-125px);
}

.dot-orange{
  color:#ff9800;
  background:#ff9800;
  transform:translate(-50%,-50%) rotate(240deg) translateY(-125px);
}

.splash-plate{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%) scaleX(-1);
  font-size:38px;
}

#splash .splash-orbit:nth-of-type(2){
  display:none;
}

.splash-title{
  margin-top:35px;
  color:#218b50;
  font-size:27px;
  font-weight:800;
}

.splash-loading{
  margin-top:8px;
  color:#638b74;
  font-size:14px;
}

@keyframes orbit{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.step{border:1.5px solid var(--bd);background:var(--card);border-radius:50%;width:46px;height:46px;font-size:24px;font-weight:700}

  color:var(--bg);

.sample{background:var(--pri2);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:40px}.sp{flex:1}
.lang{border:1.5px solid var(--pri);color:var(--pri);background:var(--card);border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px}
.bell{position:relative;border:0;background:none;font-size:24px;padding:2px 6px}
.bell i{position:absolute;top:-4px;right:-2px;background:var(--bad);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;min-width:18px;padding:0 5px;text-align:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:2px}
.banner{width:100%;border:0;background:var(--warm);color:#2a1d00;font-weight:700;border-radius:12px;padding:12px;margin-bottom:10px;font-size:15px}
select{border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;max-width:60%}
.bar{height:8px;background:var(--pri2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.thumb{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.ov img{max-width:100%;max-height:100%;border-radius:10px}
</style>

<script>

gas:['🔥','গ্যাস','Gas','f'],elec:['💡','বিদ্যুৎ','Electricity','f'],net:['📶','ইন্টারনেট','Internet','f'],rent:['🏠','ভাড়া','Rent','f'],maid:['👩','বুয়া','Maid','f'],clean:['🧼','ক্লিনিং','Cleaning','f']};
const nm=id=>T(IT[id][1],IT[id][2]);
const CUR={BDT:['৳','টাকা','Taka'],SAR:['SAR ','সৌদি রিয়াল','Saudi Riyal'],USD:['$','ডলার','US Dollar'],AED:['AED ','দিরহাম','UAE Dirham'],KWD:['KD ','কুয়েতি দিনার','Kuwaiti Dinar'],QAR:['QR ','কাতারি রিয়াল','Qatari Riyal'],OMR:['OMR ','ওমানি রিয়াল','Omani Rial'],MYR:['RM ','রিঙ্গিত','Malaysian Ringgit'],INR:['₹','ভারতীয় রুপি','Indian Rupee'],GBP:['£','পাউন্ড','British Pound'],EUR:['€','ইউরো','Euro']};
const CC=[['+880','🇧🇩'],['+966','🇸🇦'],['+971','🇦🇪'],['+965','🇰🇼'],['+974','🇶🇦'],['+968','🇴🇲'],['+60','🇲🇾'],['+1','🇺🇸'],['+44','🇬🇧'],['+91','🇮🇳']];
const USERS={};

const mny=n=>cs()+fmt(n);
const dt=d=>new Date(d).toLocaleDateString(L=='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short'});
let REG=[],M=null;
let S={screen:'auth',user:null,cur:'BDT',astep:'start',amode:'login',cc:'+880',ph:'',otp:'',via:'phone',memo:null,view:null,tab:'home',type:'meal',name:'',members:[],item:null,amt:'',payer:0,toast:'',jcode:'',found:null,pend:null};

function mk(name,type,members,cur){
  let code;do code='SM-'+(1000+Math.floor(Math.random()*9000));while(REG.some(m=>m.code==code));
  const m={code,name,type,members,cur:cur||'BDT',me:0,meals:{},exp:[],reqs:[]};REG.push(m);return m;
}
function seed(m){
  const n=m.members.length;m.members.forEach((_,i)=>m.meals[i]=[48,52,40,56][i%4]);
  m.exp=[['fish',0,2400],['veg',1,1800],['chk',2,3200],['rice',3,2600],['rent',0,12000],['gas',1,1200],['net',2,800]].map(([item,p,amt],k)=>({item,payer:p%n,amt,d:Date.now()-k*864e5}));
}


function calc(){
  const n=M.members.length;let baz=0,fix=0;const paid=M.members.map(()=>0);
  M.exp.forEach(e=>{IT[e.item][3]=='b'?baz+=e.amt:fix+=e.amt;paid[e.payer]+=e.amt});
  const tm=M.members.reduce((a,_,i)=>a+(M.meals[i]||0),0);
  const meal=M.type=='meal';const rate=meal&&tm?baz/tm:0;
  const due=M.members.map((_,i)=>meal?(M.meals[i]||0)*rate+fix/n:(baz+fix)/n);
  const bal=due.map((d,i)=>paid[i]-d);
  return{n,baz,fix,paid,tm,rate,due,bal,tot:baz+fix,per:(baz+fix)/n};
}
function settle(bal){
  const d=[],c=[];bal.forEach((b,i)=>{if(b<-0.5)d.push([i,-b]);else if(b>0.5)c.push([i,b])});
  d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const r=[];
  while(d.length&&c.length){const x=Math.min(d[0][1],c[0][1]);r.push([d[0][0],c[0][0],x]);d[0][1]-=x;c[0][1]-=x;if(d[0][1]<.5)d.shift();if(c[0][1]<.5)c.shift()}
  return r;
}

async function authAction(){
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPass').value;
  const name=document.getElementById('authName')?.value.trim();
  const signup=S.amode=='signup';

  try{
    let result;

    if(signup){
      result=await auth.createUserWithEmailAndPassword(email,pass);

    }else{
      result=await auth.signInWithEmailAndPassword(email,pass);
    }

    S.user={
      uid:result.user.uid,
      name:result.user.displayName||email.split('@')[0],
      email:result.user.email

const userRef=db.collection('users').doc(result.user.uid);
const userSnap=await userRef.get();

if(!userSnap.exists){
  await userRef.set({
    uid:result.user.uid,
    name:S.user.name,
    email:S.user.email,
    messId:null,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
}
    

  }catch(e){

      'auth/email-already-in-use':T('এই ইমেইলে আগে থেকেই একাউন্ট আছে','An account already exists with this email'),

async function after(){
  alert('AFTER STARTED');
  try{
    const uid=auth.currentUser.uid;
    const userSnap=await db.collection('users').doc(uid).get();

    if(!userSnap.exists)
      throw new Error('USER_NOT_FOUND');

    const messId=userSnap.data().messId;

    S.astep='start';

    if(!messId){
      if(window._smartMessExpenseUnsub){
        window._smartMessExpenseUnsub();
        window._smartMessExpenseUnsub=null;
      }
      if(window._smartMessMealUnsub){
        window._smartMessMealUnsub();
        window._smartMessMealUnsub=null;
      }
      M=null;
      S.screen='welcome';
      render();
      return;
    }

    const messRef=db.collection('messes').doc(messId);

    const [messSnap,myMemberSnap,membersSnap]=await Promise.all([
      messRef.get(),
      messRef.collection('members').doc(uid).get(),
      messRef.collection('members').where('status','==','active').get()
    ]);

    let requestsSnap={docs:[]};

    if(myMemberSnap.exists && myMemberSnap.data().role=='admin'){
      requestsSnap=await messRef.collection('joinRequests').get();
    }

    if(!messSnap.exists || !myMemberSnap.exists)
      throw new Error('MESS_NOT_FOUND');

    const myMember=myMemberSnap.data();

    if(myMember.status!='active')
      throw new Error('MEMBERSHIP_INACTIVE');

    const data=messSnap.data();

    const memberDocs=membersSnap.docs.filter(d=>d.data().status=='active');

    const memberUids=memberDocs.map(d=>d.id);
    const members=memberDocs.map(d=>d.data().name);

    M={
      id:messId,
      code:data.code,
      name:data.name,
      type:data.type,
      cur:data.currency,
      adminUid:data.adminUid,
      role:myMember.role,
      memberUids:memberUids,
      members:members,
      me:memberUids.indexOf(uid),
      meals:{},
      exp:[],
      reqs:requestsSnap.docs.map(d=>{
        const r=d.data();
        return {
          uid:d.id,
          name:r.name,
          s:r.status=='pending'?'p':r.status=='accepted'?'a':'r'
        };
      })
    };

    S.members=[...members];
    S.payer=M.me;
    S.screen='app';
    S.tab='home';

    if(window._smartMessExpenseUnsub){
      window._smartMessExpenseUnsub();
      window._smartMessExpenseUnsub=null;
    }

    if(window._smartMessMealUnsub){
      window._smartMessMealUnsub();
      window._smartMessMealUnsub=null;
    }

    render();

    // EXPENSE LIVE SYNC
    window._smartMessExpenseUnsub=
      messRef.collection('expenses').onSnapshot(snapshot=>{

        if(!M || M.id!=messId) return;

        M.exp=snapshot.docs.map(doc=>{
          const e=doc.data();

          return {
            id:doc.id,
            item:e.item,
            payer:memberUids.indexOf(e.payerUid),
            amt:e.amt,
            d:e.d,
            memo:e.memo
          };
        });

        render();

      },error=>{
        console.error('EXPENSE SYNC ERROR:',error);
        say('খরচ আপডেট করা যায়নি: '+(error.code||error.message));
      });

    // MEAL LIVE SYNC
    window._smartMessMealUnsub=
      messRef.collection('mealCounts').onSnapshot(snapshot=>{

        if(!M || M.id!=messId) return;

        M.meals={};

        snapshot.docs.forEach(doc=>{
          const i=memberUids.indexOf(doc.id);

          if(i>=0){
            M.meals[i]=Number(doc.data().count)||0;
          }
        });

        render();

      },error=>{
        console.error('MEAL SYNC ERROR:',error);
        say('মিল আপডেট করা যায়নি: '+(error.code||error.message));
      });
    alert('AFTER FINISHED');

  }catch(e){
    console.error(e);
    say(T('আগের মেস লোড করা যায়নি। আবার চেষ্টা করুন।','Could not load your previous mess. Please try again.'));
  }
}

async function start(){
  if(!auth.currentUser) return say(T('আগে লগইন করুন','Please login first'));

  const name=S.name.trim()||T('আমার মেস','My mess');
  const uid=auth.currentUser.uid;
  const userRef=db.collection('users').doc(uid);
  const messRef=db.collection('messes').doc();

  try{
    say(T('মেস তৈরি হচ্ছে...','Creating mess...'));

    const result=await db.runTransaction(async tx=>{
      const userSnap=await tx.get(userRef);

      if(!userSnap.exists)
        throw new Error('USER_PROFILE_MISSING');

      if(userSnap.data().messId)
        throw new Error('ALREADY_IN_MESS');

      let code='',codeRef=null;

      for(let i=0;i<10;i++){
        const candidate='SM-'+(1000+Math.floor(Math.random()*9000));
        const ref=db.collection('messCodes').doc(candidate);
        const snap=await tx.get(ref);

        if(!snap.exists){
          code=candidate;
          codeRef=ref;
          break;
        }
      }

      if(!code)
        throw new Error('CODE_GENERATION_FAILED');

      const now=firebase.firestore.FieldValue.serverTimestamp();

      tx.set(messRef,{
        name:name,
        code:code,
        type:S.type,
        currency:S.cur,
        adminUid:uid,
        ownerUid:uid,
        createdAt:now
      });

      tx.set(codeRef,{
        messId:messRef.id
      });

      tx.set(
        messRef.collection('members').doc(uid),
        {
          uid:uid,
          name:S.user.name,
          role:'admin',
          status:'active',
          joinedAt:now
        }
      );

      tx.update(userRef,{
        messId:messRef.id
      });

      return {code:code};
    });

    M={
      id:messRef.id,
      code:result.code,
      name:name,
      type:S.type,
      members:[S.user.name],
      cur:S.cur,
      me:0,
      meals:{},
      exp:[],
      reqs:[]
    };

    S.payer=0;
    S.screen='app';
    S.tab='home';
    render();

    say(T('মেস তৈরি হয়েছে। কোড: ','Mess created. Code: ')+M.code);

  }catch(e){
    console.error(e);

    const errors={
      USER_PROFILE_MISSING:T('ইউজার তথ্য পাওয়া যায়নি।','User prof}ile not found.'),
      ALREADY_IN_MESS:T('আপনি ইতিমধ্যে একটি মেসে আছেন।','You already belong to a mess.'),
      CODE_GENERATION_FAILED:T('মেস কোড তৈরি করা যায়নি। আবার চেষ্টা করুন।','Could not generate a mess code.')
    };

    say(errors[e.message]||T('মেস তৈরি হয়নি। আবার চেষ্টা করুন।','Mess creation failed. Please try again.'));
  }
}

async function search(){
  const c=S.jcode.trim().toUpperCase();
  S.pend=null;
  S.found=null;

  if(!c){
    S.found=false;
    render();
    return;
  }

  try{
    const codeSnap=await db.collection('messCodes').doc(c).get();

    if(!codeSnap.exists){
      S.found=false;
      render();
      return;
    }

    const messId=codeSnap.data().messId;
    const messSnap=await db.collection('messes').doc(messId).get();

    if(!messSnap.exists){
      S.found=false;
      render();
      return;
    }

    const data=messSnap.data();

    S.found={
      id:messId,
      code:data.code,
      name:data.name,
      type:data.type,
      cur:data.currency
    };

  }catch(e){
    console.error(e);
    S.found=false;
    say('মেস খুঁজতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');

}
async function send(){
  const n=document.getElementById('jn').value.trim();

  if(!n)
    return say(T('আপনার নাম লিখুন','Enter your name'));

  if(!auth.currentUser)
    return say(T('আগে লগইন করুন','Please login first'));

  const uid=auth.currentUser.uid;
  const messId=S.found.id;

  try{
    say(T('অনুরোধ পাঠানো হচ্ছে...','Sending request...'));

    const userRef=db.collection('users').doc(uid);
    const requestRef=db.collection('messes')
      .doc(messId)
      .collection('joinRequests')
      .doc(uid);

    await db.runTransaction(async tx=>{
      const userSnap=await tx.get(userRef);
      const requestSnap=await tx.get(requestRef);

      if(!userSnap.exists)
        throw new Error('USER_NOT_FOUND');

      if(userSnap.data().messId)
        throw new Error('ALREADY_IN_MESS');

      if(requestSnap.exists && requestSnap.data().status=='pending')
        throw new Error('REQUEST_EXISTS');

      tx.set(requestRef,{
        uid:uid,
        name:n,
        email:auth.currentUser.email,
        status:'pending',
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    S.pend={name:n,s:'p'};
    say(T('যোগদানের অনুরোধ পাঠানো হয়েছে।','Join request sent successfully.'));
    render();

  }catch(e){
    console.error(e);

    const messages={
      USER_NOT_FOUND:'ইউজার তথ্য পাওয়া যায়নি।',
      ALREADY_IN_MESS:'আপনি ইতিমধ্যে একটি মেসে আছেন।',
      REQUEST_EXISTS:'আপনার অনুরোধ আগেই পাঠানো হয়েছে।'
    };

    say(messages[e.message]||'অনুরোধ পাঠানো যায়নি। Firebase Rules পরীক্ষা করতে হবে।');
  }
}

  const rows=M.reqs.map((r,i)=>({r,i}));const P=rows.filter(x=>x.r.s=='p'),D=rows.filter(x=>x.r.s!='p');

async function decide(i,ok){
  const r=M.reqs[i];

  if(!r || !r.uid)
    return say('অনুরোধের তথ্য পাওয়া যায়নি।');

  const uid=auth.currentUser.uid;
  const messId=M.id;

  try{
    say('প্রক্রিয়া চলছে...');

    const messRef=db.collection('messes').doc(messId);
    const requestRef=messRef.collection('joinRequests').doc(r.uid);
    const userRef=db.collection('users').doc(r.uid);
    const memberRef=messRef.collection('members').doc(r.uid);
    const adminRef=messRef.collection('members').doc(uid);

    await db.runTransaction(async tx=>{
      const requestSnap=await tx.get(requestRef);
      
      const memberSnap=await tx.get(memberRef);
      const adminSnap=await tx.get(adminRef);
      const messSnap=await tx.get(messRef);

      if(!requestSnap.exists ||
         requestSnap.data().status!='pending')
        throw new Error('REQUEST_NOT_PENDING');

      if(!messSnap.exists ||
         messSnap.data().adminUid!=uid ||
         !adminSnap.exists ||
         adminSnap.data().role!='admin' ||
         adminSnap.data().status!='active')
        throw new Error('NOT_ADMIN');

      if(ok){
        

        

        if(memberSnap.exists)
          throw new Error('MEMBER_EXISTS');

        const data=requestSnap.data();

        tx.set(memberRef,{
          uid:r.uid,
          name:data.name,
          email:data.email,
          role:'member',
          status:'active',
          joinedAt:firebase.firestore.FieldValue.serverTimestamp()
        });

        tx.update(userRef,{
          messId:messId
        });

        tx.update(requestRef,{
          status:'accepted',
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        });

      }else{
        tx.update(requestRef,{
          status:'rejected',
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    });

    r.s=ok?'a':'r';

    if(ok){
      M.members.push(r.name);
      M.memberUids.push(r.uid);
    }

    say(ok?'মেম্বার সফলভাবে যোগ হয়েছে।':'অনুরোধ বাতিল হয়েছে।');
    render();

  }catch(e){
    console.error(e);

    const messages={
      REQUEST_NOT_PENDING:'এই অনুরোধটি আর Pending নেই।',

}
function addView(){
  if(!S.item){
    const g=k=>Object.entries(IT).filter(([_,v])=>v[3]==k).map(([id,v])=>`<button class="ic" onclick="S.item='${id}';S.amt='';render()"><span>${v[0]}</span><small>${nm(id)}</small></button>`).join('');

  <div class="amt">${cs()}${S.amt?bn(Number(S.amt).toLocaleString('en-US')):bn(0)}</div>
  <div class="quick">${[100,200,500,1000].map(q=>`<button onclick="S.amt=String((Number(S.amt)||0)+${q});render()">+${bn(q)}</button>`).join('')}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" onclick="key('${k}')">${bn(k)}</button>`).join('')}<button class="key" onclick="key('00')">${bn('00')}</button><button class="key" onclick="key('0')">${bn(0)}</button><button class="key" onclick="S.amt=S.amt.slice(0,-1);render()" aria-label="${T('মুছুন','Delete')}">⌫</button></div>
  <h2>${T('কে কিনেছে?','Who bought it?')}</h2>${M.me==0?`<div class="chips">${M.members.map((m,i)=>`<button class="chip ${S.payer==i?'on':''}" onclick="S.payer=${i};render()">${esc(m)}</button>`).join('')}</div>`:`<div class="mut">${esc(M.members[M.me])} (${T('আপনি','you')})</div>`}
  <h2>🧾 ${T('মেমো / রসিদ (ঐচ্ছিক)','Receipt (optional)')}</h2>${S.memo?`<div class="row"><img class="thumb" src="${S.memo}" alt=""><button class="x" onclick="S.memo=null;render()" aria-label="${T('সরান','Remove')}">✕</button></div>`:`<label class="btn ghost" style="display:block;text-align:center"><input type="file" accept="image/*" style="display:none" onchange="memo(this)">📷 ${T('মেমোর ছবি তুলুন বা আপলোড করুন','Take or upload a receipt photo')}</label>`}
  <div style="height:8px"></div><button class="btn" ${Number(S.amt)>0?'':'disabled'} onclick="saveExp()">✅ ${T('খরচ সংরক্ষণ করুন','Save expense')}</button>`;
}
function memo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.memo=c.toDataURL('image/jpeg',.7);render()};im.src=r.result};r.readAsDataURL(f)}
function key(k){if((S.amt+k).length<=6)S.amt=String(Number(S.amt+k));render()}
async function saveExp(){
  const item=S.item;
  const amt=Number(S.amt);
  const payer=M.role=='admin'
    ? Math.min(S.payer,M.members.length-1)
    : M.me;

  if(!item || !amt || amt<=0)
    return say('সঠিক খরচের পরিমাণ দিন।');

  try{
    say('খরচ সংরক্ষণ হচ্ছে...');

    const expense={
      item:item,
      payerUid:M.memberUids[payer],
      amt:amt,
      d:Date.now(),
      memo:S.memo||null,
      createdBy:auth.currentUser.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    const doc=await db.collection('messes')
      .doc(M.id)
      .collection('expenses')
      .add(expense);

    

    S.item=null;
    S.amt='';
    S.memo=null;
    S.tab='home';

    say(T('খরচ সংরক্ষণ হয়েছে','Expense saved'));
    render();

  }catch(e){
    console.error('EXPENSE SAVE ERROR:',e);
    say('খরচ সংরক্ষণ হয়নি: '+(e.code||e.message));
  }
}

async function changeMeal(i,delta){
  if(i!==M.me) return;

  const uid=M.memberUids[i];
  const ref=db.collection('messes')
    .doc(M.id)
    .collection('mealCounts')
    .doc(uid);

  const current=Number(M.meals[i])||0;
  const count=Math.max(0,current+delta);

  if(count===current) return;

  try{
    await ref.set({
      count:count,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
  }catch(e){
    console.error('MEAL SAVE ERROR:',e);
    say('মিল সংরক্ষণ হয়নি: '+(e.code||e.message));
  }
}

}
function render(){
  document.documentElement.lang=L;
  let v,nav='';
  if(S.screen=='auth')v=authView();else if(S.screen=='welcome')v=welcomeView();else if(S.screen=='create')v=createView();else if(S.screen=='join')v=joinView();
  else{
    const tabs=[['home','🏠',T('হোম','Home')],['add','➕',T('খরচ','Add')]].concat(M.type=='meal'?[['meal','🍽️',T('মিল','Meals')]]:[]).concat([['rep','📊',T('হিসাব','Report')]]).concat(M.role=='admin'?[['req','🔔',T('অনুরোধ','Requests')]]:[]);
    v=({home:homeView,add:addView,meal:mealView,rep:reportView,req:reqView,settings:settingsView}[S.tab]||homeView)();
    nav=`<nav><div>${tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></nav>`;
  }
  document.getElementById('app').innerHTML=topbar()+v+nav+(S.view!=null&&M.exp[S.view]?`<div class="ov" onclick="S.view=null;render()"><img src="${M.exp[S.view].memo}" alt=""></div>`:'')+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}
render();

function hideSplash(){
  setTimeout(()=>{
    const splash=document.getElementById('splash');
    if(splash) splash.remove();
  },1200);
}

auth.onAuthStateChanged(async user=>{
  alert('AUTH CHECK STARTED');
  
  if(user){
    S.user={
      uid:user.uid,
      name:user.displayName||user.email.split('@')[0],
      email:user.email

    await after();
    hideSplash();

  }else{
    S.user=null;
    M=null;
    S.screen='auth';
    render();

});

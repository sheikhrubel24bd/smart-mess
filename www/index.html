<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Mess</title>

<style>
  /* SMART MESS RESPONSIVE SPLASH SCREEN */
#splash{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#f0fff7;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:16px;
}

#splash::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:max(env(safe-area-inset-top, 0px), 28px);
  background:#16794f;
  z-index:1;
  pointer-events:none;
}

/* Keep the status-bar area green on Welcome, Create Mess and Find Mess screens. */
body.pre-mess-screen::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:max(env(safe-area-inset-top, 0px), 28px);
  background:#16794f;
  z-index:99998;
  pointer-events:none;
}

/* Keep the native status-bar area green on Login and Sign Up screens too. */
body.auth-screen::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:max(env(safe-area-inset-top, 0px), 28px);
  background:#16794f;
  z-index:99998;
  pointer-events:none;
}

.splash-stage{
  position:relative;
  width:min(78vw, 34vh, 320px);
  aspect-ratio:1 / 1;
  flex:0 0 auto;
}

.splash-stage::before{
  content:"";
  position:absolute;
  inset:0;
  border:2px dashed #218b50;
  border-radius:50%;
}

.splash-logo{
  position:absolute;
  width:80%;
  height:80%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  object-fit:contain;
  z-index:2;
}

.splash-orbit{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  animation:orbit 5s linear infinite;
  z-index:3;
  pointer-events:none;
}

.splash-dot{
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  box-shadow:0 0 12px currentColor;
  transform:translate(-50%,-50%);
}

.dot-red{
  top:0;
  left:50%;
  color:#ff3030;
  background:#ff3030;
}

.dot-blue{
  top:75%;
  left:93.3%;
  color:#2196f3;
  background:#2196f3;
}

.dot-orange{
  top:75%;
  left:6.7%;
  color:#ff9800;
  background:#ff9800;
}

.splash-title{
  margin-top:clamp(16px, 3vh, 30px);
  color:#218b50;
  font-size:clamp(23px, 6vw, 27px);
  font-weight:800;
  text-align:center;
}

.splash-loading{
  margin-top:clamp(4px, 1vh, 8px);
  color:#638b74;
  font-size:clamp(13px, 3.5vw, 14px);
  text-align:center;
}

@keyframes orbit{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

:root{--bg:#f4f6f1;--card:#fff;--ink:#17261f;--mut:#667a70;--pri:#16794f;--pri2:#dff1e7;--on:#fff;--bad:#c93d3d;--bad2:#fbe6e6;--bd:#dde4dc;--warm:#f2b134;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--ink:#e8f0ea;--mut:#92a89b;--pri:#3dbd85;--pri2:#1f3a2e;--on:#0b1a12;--bad:#ff7b7b;--bad2:#3b2222;--bd:#2b3a32}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--ink:#e8f0ea;--mut:#92a89b;--pri:#3dbd85;--pri2:#1f3a2e;--on:#0b1a12;--bad:#ff7b7b;--bad2:#3b2222;--bd:#2b3a32}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri","Kalpurush",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:16px 14px 112px}
.top.app-topbar{
  display:flex;align-items:center;gap:9px;
  min-height:calc(62px + env(safe-area-inset-top,0px));
  margin:calc(-16px - env(safe-area-inset-top,0px)) -14px 14px;
  padding:env(safe-area-inset-top,0px) 14px 0;
  background:#16794f;color:#fff;
  box-shadow:0 3px 10px #0c513326;
}
.app-brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-size:19px;font-weight:800;white-space:nowrap}
.app-brand-mark{width:33px;height:33px;border:1.7px solid #ffffffb8;border-radius:11px;display:grid;place-items:center;font-size:21px;line-height:1}
.top.app-topbar .x,.top.app-topbar .bell,.top.app-topbar .lang{
  color:#fff;border:0;background:transparent;
}
.top.app-topbar .x{font-size:25px;padding:4px 7px}
.top.app-topbar .bell{font-size:22px;padding:4px 7px}
.top.app-topbar .bell i{background:#ffcf4a;color:#263629}
.top.app-topbar .lang{border:1px solid #ffffff80;border-radius:10px;padding:6px 9px;font-size:13px}
.top.app-topbar .sp{display:block;flex:1;min-width:0}



/* WELCOME: CREATE OR FIND A MESS */
.welcome-page{padding:0 0 24px}
.welcome-user{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 2px 4px}
.welcome-lang{border:1px solid #16794f;background:#fff;color:#16794f;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.welcome-logout{border:1px solid #b9dfc7;background:#f0faf3;color:#16794f;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.welcome-brand{text-align:center;padding:0 8px 0}
.welcome-brand img{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 2px}
.welcome-brand h1{margin:0;color:#16794f;font-size:30px;font-weight:850;letter-spacing:-.5px}
.welcome-brand p{margin:4px 0 0;color:#315d45;font-size:13px}
.welcome-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 10px 22px;color:#168653}
.welcome-divider span{height:2px;flex:1;background:linear-gradient(90deg,transparent,#5bd58c)}
.welcome-divider span:last-child{background:linear-gradient(90deg,#5bd58c,transparent)}
.welcome-divider b{font-size:18px;line-height:1}
.welcome-option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 12px;margin:0 0 15px;border:1.5px solid #a9e8c2;border-radius:23px;background:linear-gradient(110deg,#fff 0%,#f5fff8 100%);color:#16794f;box-shadow:0 4px 12px #0c513318;min-height:150px}
.welcome-art{width:112px;height:112px;flex:0 0 112px;border-radius:50%;display:grid;place-items:center;background:#dff8e8}
.welcome-art svg{width:100%;height:100%;padding:8px}
.search-art{background:#e5f2ff;color:#1679bd}
.welcome-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:6px}
.welcome-copy b{font-size:23px;line-height:1.25;color:#087344}
.welcome-copy small{font-size:12px;line-height:1.6;color:#354b3e;font-weight:500}
.welcome-arrow{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:#168653;color:#fff;font-size:32px;line-height:1}
.welcome-note{display:flex;align-items:center;justify-content:center;gap:10px;margin:28px 6px 0;padding:13px 12px;border:1px solid #a9e8c2;border-radius:99px;background:#e1f9e9;color:#174b2e;font-size:12px;line-height:1.5;text-align:left}
.welcome-shield{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:#159653;color:#fff;font-weight:900;font-size:17px}
@media(max-width:360px){.welcome-brand img{width:94px;height:94px}.welcome-brand h1{font-size:26px}.welcome-option{gap:9px;padding:12px 9px;min-height:128px;border-radius:19px}.welcome-art{width:86px;height:86px;flex-basis:86px}.welcome-copy b{font-size:19px}.welcome-copy small{font-size:11px}.welcome-arrow{width:32px;height:32px;flex-basis:32px}.welcome-note{font-size:11px;margin-top:20px}}

/* REGULAR MESS HOME DASHBOARD */
.regular-welcome{margin:2px 0 17px}
.regular-welcome h1{font-size:23px;margin:3px 0 7px}
.regular-code{display:inline-flex;align-items:center;gap:8px;background:#e1f5e8;color:#087b42;border:1px solid #c5e8d1;border-radius:9px;padding:4px 9px;font-size:11px;line-height:1.35}
.regular-code b{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.5px}
.regular-copy{border:0;background:transparent;color:#087b42;font-size:15px;line-height:1;padding:1px 3px}
.regular-section-title{font-size:18px;color:#087b42;margin:8px 0 13px}
.regular-summary-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 13px}
.regular-summary-head .regular-section-title{margin:0;min-width:0}
.regular-personal-card{width:48%;max-width:178px;min-width:0;background:#e3efff;color:#2161bd;border:1px solid #b9d4f3;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;line-height:1.3}
.regular-personal-top{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0}

@media(max-width:360px){.regular-summary-head{gap:7px}.regular-summary-head .regular-section-title{font-size:16px}.regular-personal-card{padding:7px 8px}.regular-personal-name{font-size:11px}.regular-personal-amount{font-size:15px}}

.regular-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:20px}
.regular-card{min-width:0;min-height:112px;padding:14px 12px;border:1px solid #b9dfc6;box-sizing:border-box;border-radius:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px}
.regular-card-icon{font-size:25px;line-height:1.1;margin-bottom:2px}
.regular-card small{font-size:12px;line-height:1.4}
.regular-card b{font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.regular-market{background:#fff0dc;color:#bd6900}
.regular-other{background:#ffe8e8;color:#c52d36}
.regular-deposit{background:#e3efff;color:#2161bd}
.regular-members{background:#e1f5e8;color:#087b42}
.regular-recent{background:#fff;border:1px solid #e2eee6;border-radius:16px;padding:15px;margin-top:4px}
.regular-recent h2{font-size:17px;color:#087b42;margin:0 0 8px}
.regular-expense{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf1ee;min-width:0}
.regular-expense:last-child{border-bottom:0}
.regular-expense-icon{font-size:23px;flex:0 0 28px;text-align:center}
.regular-expense-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.regular-expense-info b{font-size:14px;overflow-wrap:anywhere}
.regular-expense-info small{font-size:11px;color:#718078;line-height:1.4}
.regular-expense strong{font-size:14px;white-space:nowrap}
@media(max-width:360px){
 .regular-card{padding:12px 10px;min-height:105px}
 .regular-card b{font-size:18px}
 .regular-card small{font-size:11px}
 .regular-summary{gap:9px}
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .regular-code{background:#1f3a2e;color:#a7e8bd;border-color:#315a40}
 :root:not([data-theme="light"]) .regular-recent{background:var(--card);border-color:var(--bd)}
 :root:not([data-theme="light"]) .regular-expense{border-color:var(--bd)}
 :root:not([data-theme="light"]) .regular-expense-info small{color:var(--mut)}
}
:root[data-theme="dark"] .regular-code{background:#1f3a2e;color:#a7e8bd;border-color:#315a40}
:root[data-theme="dark"] .regular-recent{background:var(--card);border-color:var(--bd)}
:root[data-theme="dark"] .regular-expense{border-color:var(--bd)}
:root[data-theme="dark"] .regular-expense-info small{color:var(--mut)}

/* PULL TO REFRESH */
#pullRefresh{
  position:fixed;
  top:calc(env(safe-area-inset-top, 0px) + 8px);
  left:50%;
  transform:translate(-50%,-100px);
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  color:var(--pri);
  box-shadow:0 2px 10px #0002;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  z-index:999;
  transition:transform .2s;
}

#pullRefresh.loading{
  transform:translate(-50%,12px);
}

#pullRefresh.loading span{
  animation:refreshSpin .8s linear infinite;
}

@keyframes refreshSpin{
  to{transform:rotate(360deg)}
}

h1{font-size:26px;margin:4px 0 2px}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;cursor:pointer}
  /* BUTTON TOUCH EFFECT */
button{
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease, filter .15s ease;
}
button:active{
  filter:brightness(.88);
}
button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.btn{width:100%;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-weight:700;padding:15px;font-size:17px}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn:disabled{opacity:.4}
input[type=text]{
  width:100%;
  border:1.5px solid var(--bd);
  background:var(--card);
  color:var(--ink);
  border-radius:10px;
  padding:12px;
  font:inherit;
  caret-color:#159447;
  cursor:text;
  outline-color:#159447;
}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:14px 10px;text-align:center}
.type.on{border-color:var(--pri);background:var(--pri2)}
.type b{display:block;font-size:17px}.type span{font-size:30px;display:block}.type small{color:var(--mut);font-size:13px;line-height:1.3;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1.5px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 14px}
.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ic{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center}
.ic span{font-size:38px;display:block;line-height:1.2}.ic small{font-size:14px;font-weight:600}
.ic:active{background:var(--pri2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat.hero{grid-column:1/3;background:var(--pri);color:var(--on);border-color:var(--pri)}
.stat.hero b{font-size:34px}
 .stat.deposit-stat{
  background:#e5f4f5;
  border:1px solid #b5dfe1;
  color:#176b70;
}
.stat.deposit-stat small{
  color:#287f84;
}
.stat.deposit-stat b{
  font-size:26px;
}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}.li .e{font-size:28px}.li .t{flex:1}.li .t small{display:block;color:var(--mut)}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:6px 10px}
.amt{font-size:46px;font-weight:800;text-align:center;padding:8px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.key{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 0;font-size:20px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1.5px solid var(--pri);background:var(--pri2);border-radius:10px;padding:9px 0;font-weight:700}
.step{border:1.5px solid var(--bd);background:var(--card);border-radius:50%;width:46px;height:46px;font-size:24px;font-weight:700}
.cnt{min-width:46px;text-align:center;font-size:22px;font-weight:800}
.pos{color:var(--pri)}.neg{color:var(--bad)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.tag.pos{background:var(--pri2)}.tag.neg{background:var(--bad2)}

.i-bell{background-position:0 0}.i-settings{background-position:16.6667% 0}.i-home{background-position:33.3333% 0}.i-add{background-position:50% 0}.i-receipt{background-position:66.6667% 0}.i-task{background-position:83.3333% 0}.i-meals{background-position:100% 0}

.nav-icon{width:23px;height:23px}

nav button.on{background:#35a866;color:#fff;font-weight:800}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:96px;
  width:calc(100% - 36px);
  max-width:420px;
  box-sizing:border-box;
  background:var(--ink);
  color:var(--bg);
  padding:14px 18px;
  border-radius:14px;
  font-weight:600;
  font-size:14px;
  line-height:1.6;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere;
  z-index:50;
}
.sample{background:var(--pri2);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:40px}.sp{flex:1}
.lang{border:1.5px solid var(--pri);color:var(--pri);background:var(--card);border-radius:99px;padding:5px 13px;font-weight:700;font-size:14px}

.bell i{position:absolute;top:-4px;right:-2px;background:var(--bad);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;min-width:18px;padding:0 5px;text-align:center}
.code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:2px}
.banner{width:100%;border:0;background:var(--warm);color:#2a1d00;font-weight:700;border-radius:12px;padding:12px;margin-bottom:10px;font-size:15px}
select{border:1.5px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;padding:10px;font:inherit;max-width:60%}

function calc(){
  const n=M.members.length;
  let baz=0,fix=0;

  (M.exp||[]).forEach(e=>{
    const amount=Number(e.amt)||0;
    IT[e.item]?.[3]==='b'?baz+=amount:fix+=amount;
  });

  const meal=M.type==='meal';

  // Regular Mess: প্রতিটি খরচের সময়কার সদস্য তালিকা অনুযায়ী ভাগ।
  // নতুন সদস্যের আগের খরচ এবং চলে যাওয়া সদস্যের পরের খরচ বাদ থাকবে।
  if(!meal){
    const allAccounts=calcAllMembers();
    const activeAccounts=M.memberUids.map(uid=>{
      const member=(M.allMembers||[]).find(m=>m.uid===uid);
      return allAccounts.find(a=>a.periodId===member?.currentPeriodId)||{
        deposited:0,personalExpenses:0,share:0,bal:0
      };
    });

    const deposited=activeAccounts.map(a=>Number(a.deposited)||0);
    const paid=activeAccounts.map(a=>
      (Number(a.deposited)||0)+(Number(a.personalExpenses)||0)
    );
    const due=activeAccounts.map(a=>Number(a.share)||0);
    const bal=activeAccounts.map(a=>Number(a.bal)||0);
    const tm=0;
    const rate=0;
    const per=n?due.reduce((sum,value)=>sum+value,0)/n:0;

    return{
      n,baz,fix,paid,deposited,tm,rate,due,bal,
      tot:baz+fix,per
    };
  }

  // Meal Mess-এর আগের হিসাব অপরিবর্তিত রাখা হলো।
  const deposited=M.members.map(()=>0);
  const paid=M.members.map(()=>0);

  (M.deposits||[]).forEach(d=>{
    const i=M.memberUids.indexOf(d.uid);
    if(i>=0) deposited[i]+=Number(d.amt)||0;
  });

  M.members.forEach((_,i)=>{
    paid[i]=deposited[i];
  });

  M.exp.forEach(e=>{
    if((e.source||'pocket')==='pocket'){
      const i=M.memberUids.indexOf(e.payerUid);
      if(i>=0)paid[i]+=e.amt;
      else if(e.payer!=null)paid[e.payer]+=e.amt;
    }
  });

  const tm=M.members.reduce((a,_,i)=>a+(M.meals[i]||0),0);
  const rate=tm?baz/tm:0;
  const due=M.members.map((_,i)=>
    (M.meals[i]||0)*rate+fix/n
  );
  const bal=due.map((d,i)=>paid[i]-d);

  return{
    n,baz,fix,paid,deposited,tm,rate,due,bal,
    tot:baz+fix,
    per:(baz+fix)/n
  };
}
  function calcAllMembers(){

  // প্রতিটি join/rejoin আলাদা period account হিসেবে গণনা হবে।
  const periods=(M.periods||[]).map(p=>({
    periodId:p.id,
    uid:p.uid,
    name:p.name||((M.allMembers||[]).find(m=>m.uid===p.uid)?.name)||'',
    status:p.status||'closed',
    meals:0,
    deposited:0,
    personalExpenses:0,
    share:0,
    paid:0,
    due:0,
    bal:0,
    finalBalance:p.finalBalance,
    frozen: p.balanceFrozen===true
  }));

  const byId={};
  periods.forEach(p=>{byId[p.periodId]=p;});

  // পরীক্ষামূলক ডেটা বা Rules publish হওয়ার আগের সক্রিয় সদস্যের
  // period না থাকলে হিসাবের জন্য অস্থায়ী account তৈরি হবে।
  (M.allMembers||[]).filter(m=>m.status==='active'&&m.currentPeriodId&&!byId[m.currentPeriodId]).forEach(m=>{
    const p={periodId:m.currentPeriodId,uid:m.uid,name:m.name,status:'active',meals:0,deposited:0,personalExpenses:0,share:0,paid:0,due:0,bal:0,frozen:false};
    periods.push(p);
    byId[p.periodId]=p;
  });

  // জমা সংশ্লিষ্ট period-এ যাবে।
  (M.deposits||[]).forEach(d=>{
    let p=d.periodId?byId[d.periodId]:null;
    if(!p && !d.periodId){
      const member=(M.allMembers||[]).find(m=>m.uid===d.uid&&m.status==='active');
      p=member?.currentPeriodId?byId[member.currentPeriodId]:null;
    }
    if(p && !p.frozen) p.deposited+=Number(d.amt)||0;
  });

  // প্রতিটি খরচের ভাগ শুধু ঐ সময়কার period সদস্যদের মধ্যে হবে.
  (M.exp||[]).forEach(e=>{
    let participants=[];
    if(Array.isArray(e.participantsAtTime)&&e.participantsAtTime.length){
      participants=e.participantsAtTime
        .map(x=>byId[x.periodId])
        .filter(p=>!!p);
    }
    // পরীক্ষামূলক পুরোনো রেকর্ডে periodId null থাকলে বর্তমান সক্রিয় period ব্যবহার।
    if(!participants.length&&Array.isArray(e.memberUidsAtTime)&&e.memberUidsAtTime.length){
      participants=e.memberUidsAtTime.map(uid=>{
        const member=(M.allMembers||[]).find(m=>m.uid===uid&&m.status==='active');
        return member?.currentPeriodId?byId[member.currentPeriodId]:null;
      }).filter(Boolean);
    }

    if(!participants.length)return;
    const amount=Number(e.amt)||0;
    const share=amount/participants.length;
    // Closed/frozen period-এর ভাগ denominator-এ থাকবে, কিন্তু balance আর বদলাবে না।
    participants.forEach(p=>{if(!p.frozen)p.share+=share;});

    if((e.source||'pocket')==='pocket'){
      let payer=e.payerPeriodId?byId[e.payerPeriodId]:null;
      if(!payer){
        const member=(M.allMembers||[]).find(m=>m.uid===e.payerUid&&m.status==='active');
        payer=member?.currentPeriodId?byId[member.currentPeriodId]:null;
      }
      if(payer&&!payer.frozen)payer.personalExpenses+=amount;
    }
  });

  periods.forEach(p=>{
    if(!p.frozen){
      p.paid=p.deposited+p.personalExpenses;
      p.due=p.share;
      p.bal=p.paid-p.due;
    }else{
      p.bal=Number(p.finalBalance)||0;
    }
  });

  return periods;
}
function formerSettlementSummary(periodId, originalBalance){
  const records=(M.formerSettlements||[]).filter(x=>x.periodId===periodId);
  const paidToMess=records.filter(x=>x.kind==='payment'&&x.direction==='toMess').reduce((s,x)=>s+(Number(x.amount)||0),0);
  const paidFromMess=records.filter(x=>x.kind==='payment'&&x.direction==='fromMess').reduce((s,x)=>s+(Number(x.amount)||0),0);
  const paid=originalBalance<0?paidToMess:paidFromMess;
  const remaining=originalBalance<0?Math.min(0,originalBalance+paidToMess):Math.max(0,originalBalance-paidFromMess);
  return {records,paidToMess,paidFromMess,paid,remaining,completed:records.some(x=>x.kind==='completed')};
}
function settle(bal){
  const d=[],c=[];bal.forEach((b,i)=>{if(b<-0.5)d.push([i,-b]);else if(b>0.5)c.push([i,b])});
  d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const r=[];
  while(d.length&&c.length){const x=Math.min(d[0][1],c[0][1]);r.push([d[0][0],c[0][0],x]);d[0][1]-=x;c[0][1]-=x;if(d[0][1]<.5)d.shift();if(c[0][1]<.5)c.shift()}
  return r;
}

let googleSignInReady=false;
async function googleAuthAction(){
  const btn=document.getElementById('googleAuthBtn');
  if(!btn || btn.disabled)return;
  const oldText=btn.innerHTML;
  btn.disabled=true;
  const loadingTimer=setTimeout(()=>{
    btn.innerHTML=T('Google-এ সংযোগ হচ্ছে...','Connecting to Google...');
  },500);

  try{
    const GoogleSignIn=window.SmartMessGoogleSignIn;
    if(!GoogleSignIn)throw new Error('GOOGLE_PLUGIN_UNAVAILABLE');

    if(!googleSignInReady){
      await GoogleSignIn.initialize({
        clientId:'1009030541190-olne73hiklegje74gmq9uet78n7c1gkm.apps.googleusercontent.com'
      });
      googleSignInReady=true;
    }

    // Android Credential Manager-এর আগের Google credential state পরিষ্কার করে নতুন sign-in শুরু করুন।
    // এটি Firebase Auth session sign-out করে না; শুধু Google plugin-এর credential state reset করে।
    if(typeof GoogleSignIn.signOut==='function'){
      try{
        await GoogleSignIn.signOut();
      }catch(resetError){
        console.warn('GOOGLE CREDENTIAL RESET WARNING:',resetError);
      }
    }

    const result=await GoogleSignIn.signIn();
    if(!result?.idToken)throw new Error('GOOGLE_ID_TOKEN_MISSING');

    const credential=firebase.auth.GoogleAuthProvider.credential(result.idToken);
    await auth.signInWithCredential(credential);
    // Existing auth observer and after() handle profile creation and routing.
  }catch(e){
    console.error('GOOGLE AUTH ERROR:',e);
    if(e.code==='SIGN_IN_CANCELED' || e.code==='CANCELED' || /cancel/i.test(e.message||'')){
      const detail=[e.code,e.message].filter(Boolean).join(' | ');
      say(T('Google ত্রুটি: '+(detail||'কারণ জানা যায়নি'),'Google error: '+(detail||'No error details available')));
    }else if(e.code==='auth/account-exists-with-different-credential'){
      say(T('এই ইমেইলে আগে অন্য পদ্ধতিতে একাউন্ট করা হয়েছে। ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।','An account already exists with this email using another sign-in method. Please log in with email and password.'));
    }else if(e.message==='GOOGLE_PLUGIN_UNAVAILABLE'){
      say(T('Google লগইন প্রস্তুত নয়। অ্যাপটি আপডেট করুন।','Google sign-in is unavailable. Please update the app.'));
    }else{
      say(T('Google দিয়ে লগইন করা যায়নি। আবার চেষ্টা করুন।','Could not sign in with Google. Please try again.'));
    }
  }finally{
    clearTimeout(loadingTimer);
    if(btn){
      btn.disabled=false;
      btn.innerHTML=oldText;
    }
  }
}

function stopMessListeners(){
  const keys=[
    '_smartMessExpenseUnsub',
    '_smartMessMealUnsub',
    '_smartMessDepositUnsub',
    '_smartMessSettlementUnsub',
    '_smartMessDailyMealUnsub',
    '_smartMessMessUnsub',
    '_smartMessTaskUnsub',
    '_smartMessUserUnsub'
  ];
  keys.forEach(key=>{
    const unsubscribe=window[key];
    window[key]=null;
    if(typeof unsubscribe==='function'){
      try{ unsubscribe(); }
      catch(error){ console.warn('LISTENER CLEANUP ERROR:',key,error); }
    }
  });
}

async function ensureActiveMembershipPeriods(){
  if(!M || M.role!=='admin')return;
  const messRef=db.collection('messes').doc(M.id);
  const activeSnap=await messRef.collection('members').where('status','==','active').get();

  for(const doc of activeSnap.docs){
    if(doc.data().currentPeriodId)continue;
    const memberRef=doc.ref;
    const periodRef=messRef.collection('membershipPeriods').doc();

    await db.runTransaction(async tx=>{
      const fresh=await tx.get(memberRef);
      if(!fresh.exists || fresh.data().status!=='active' || fresh.data().currentPeriodId)return;
      const data=fresh.data();
      const joinedAt=data.joinedAt||firebase.firestore.FieldValue.serverTimestamp();
      const periodNo=Math.max(1,Number(data.periodCount)||1);
      tx.set(periodRef,{
        uid:doc.id,
        name:data.name||'',
        periodNo:periodNo,
        status:'active',
        joinedAt:joinedAt,
        leftAt:null,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      tx.update(memberRef,{
        currentPeriodId:periodRef.id,
        periodCount:periodNo
      });
    });
  }

  const [membersSnap,periodsSnap]=await Promise.all([
    messRef.collection('members').get(),
    messRef.collection('membershipPeriods').get()
  ]);
  M.allMembers=membersSnap.docs.map(d=>({
    uid:d.id,
    name:d.data().name,
    status:d.data().status,
    joinedAt:d.data().joinedAt,
    leftAt:d.data().leftAt||null,
    currentPeriodId:d.data().currentPeriodId||null,
    periodCount:Number(d.data().periodCount)||1
  }));
  M.periods=periodsSnap.docs.map(d=>({id:d.id,...d.data()}));
}

window._smartMessTaskUnsub=

    // ৪৮ ঘণ্টা পার হওয়া Completed Task খুঁজে বের করা
    const now=Date.now();

    const expiredTasks=snapshot.docs.filter(doc=>{

      const task=doc.data();

      return task.isDone===true
        && task.deleteAt
        && typeof task.deleteAt.toDate==='function'
        && task.deleteAt.toDate().getTime()<=now;

    });

    // মেয়াদ শেষ হওয়া টাস্ক মুছে ফেলা
    expiredTasks.forEach(doc=>{

        console.error(
          'TASK CLEANUP ERROR:',
          doc.id,
          error
        );

      });

    });

    render();

  },error=>{

async function start(){
  if(!auth.currentUser) return say(T('আগে লগইন করুন','Please login first'));

  const name=S.name.trim()||T('আমার মেস','My mess');
  const uid=auth.currentUser.uid;
  const userRef=db.collection('users').doc(uid);
  const messRef=db.collection('messes').doc();

  try{
    say(T('মেস তৈরি হচ্ছে...','Creating mess...'));

    const result=await db.runTransaction(async tx=>{
      const userSnap=await tx.get(userRef);

      if(!userSnap.exists)
        throw new Error('USER_PROFILE_MISSING');

      if(userSnap.data().messId)
        throw new Error('ALREADY_IN_MESS');

      let code='',codeRef=null;

      for(let i=0;i<10;i++){
        const candidate='SM-'+(1000+Math.floor(Math.random()*9000));
        const ref=db.collection('messCodes').doc(candidate);
        const snap=await tx.get(ref);

        if(!snap.exists){
          code=candidate;
          codeRef=ref;
          break;
        }
      }

      if(!code)
        throw new Error('CODE_GENERATION_FAILED');

      const now=firebase.firestore.FieldValue.serverTimestamp();

      tx.set(messRef,{
        name:name,
        code:code,
        type:S.type,
        currency:S.cur,
        status:'active',
        adminUid:uid,
        ownerUid:uid,
        createdAt:now
      });

      tx.set(codeRef,{
        messId:messRef.id
      });

      tx.set(
        messRef.collection('members').doc(uid),
        {
          uid:uid,
          name:S.user.name,
          role:'admin',
          status:'active',
          joinedAt:now
        }
      );

      tx.update(userRef,{
        messId:messRef.id
      });

      return {code:code};
    });

    M={
  id:messRef.id,
  code:result.code,
  name:name,
  type:S.type,
  currency:S.cur,
  cur:S.cur,
  adminUid:uid,
  role:'admin',
  memberUids:[uid],
  members:[S.user.name],
  memberPhones:[''],
  me:0,
  meals:{},
  exp:[],
  reqs:[]
};

    S.payer=0;
    S.screen='app';
    S.tab='home';
    render();

    say(T('মেস তৈরি হয়েছে। কোড: ','Mess created. Code: ')+M.code);

  }catch(e){
    console.error(e);

    const errors={
      USER_PROFILE_MISSING:T('ইউজার তথ্য পাওয়া যায়নি।','User prof}ile not found.'),
      ALREADY_IN_MESS:T('আপনি ইতিমধ্যে একটি মেসে আছেন।','You already belong to a mess.'),
      CODE_GENERATION_FAILED:T('মেস কোড তৈরি করা যায়নি। আবার চেষ্টা করুন।','Could not generate a mess code.')
    };

    say(errors[e.message]||T('মেস তৈরি হয়নি। আবার চেষ্টা করুন।','Mess creation failed. Please try again.'));
  }
}

async function search(){
  const c=S.jcode.trim().toUpperCase();
  S.pend=null;
  S.found=null;

  if(!c){
    S.found=false;
    render();
    return;
  }

  try{
    const codeSnap=await db.collection('messCodes').doc(c).get();

    if(!codeSnap.exists){
      S.found=false;
      render();
      return;
    }

    const messId=codeSnap.data().messId;
    const messSnap=await db.collection('messes').doc(messId).get();

    if(!messSnap.exists){
      S.found=false;
      render();
      return;
    }

    const data=messSnap.data();

    if(data.status==='deleted'){
      S.found=false;
      render();
      say(T('এই মেসটি বন্ধ করা হয়েছে।','This mess has been closed.'));
      return;
    }

    S.found={
      id:messId,
      code:data.code,
      name:data.name,
      type:data.type,
      cur:data.currency
    };

  }catch(e){
    console.error(e);
    S.found=false;
    say('মেস খুঁজতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');

  render();
}
async function send(){
  const n=document.getElementById('jn').value.trim();
  const phone=document.getElementById('jp').value.trim();

  if(!n)
    return say(T('আপনার নাম লিখুন','Enter your name'));
  if(!phone)
    return say(T('মোবাইল নম্বর লিখুন','Enter your mobile number'));

  if(!auth.currentUser)
    return say(T('আগে লগইন করুন','Please login first'));

  const uid=auth.currentUser.uid;
  const messId=S.found.id;

  try{
    say(T('অনুরোধ পাঠানো হচ্ছে...','Sending request...'));

    const userRef=db.collection('users').doc(uid);
    const requestRef=db.collection('messes')
      .doc(messId)
      .collection('joinRequests')
      .doc(uid);

    await db.runTransaction(async tx=>{
      const userSnap=await tx.get(userRef);
      const requestSnap=await tx.get(requestRef);

      if(!userSnap.exists)
        throw new Error('USER_NOT_FOUND');

      if(userSnap.data().messId)
        throw new Error('ALREADY_IN_MESS');

      if(requestSnap.exists && requestSnap.data().status=='pending')
        throw new Error('REQUEST_EXISTS');

      tx.set(requestRef,{
        uid:uid,
        name:n,
        email:auth.currentUser.email,
        status:'pending',
        phone:phone,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      tx.update(userRef,{
        pendingMessId:messId,
        pendingMessName:S.found.name,
        pendingMessCode:S.found.code,
        pendingMessType:S.found.type||'regular',
        pendingJoinStatus:'pending'
      });
    });

    S.pend={name:n,s:'p'};
    S.pendingJoin={
      id:messId,
      name:S.found.name||'',
      code:S.found.code||'',
      type:S.found.type||'regular'
    };
    M={
      id:messId,name:S.found.name||'',code:S.found.code||'',
      type:S.found.type||'regular',cur:S.found.cur||'BDT',
      role:'pending',members:[],memberUids:[],memberPhones:[],
      allMembers:[],reqs:[],exp:[],deposits:[],meals:{},
      mealCountsByUid:{},dailyMeals:[]
    };
    S.screen='app';
    S.tab='home';
    say(T('যোগদানের অনুরোধ পাঠানো হয়েছে।','Join request sent successfully.'));
    render();
    window._smartMessUserUnsub=db.collection('users').doc(uid).onSnapshot(snap=>{
      if(!snap.exists) return;
      const latest=snap.data()||{};
      if(latest.messId){
        if(window._smartMessUserUnsub){
          window._smartMessUserUnsub();
          window._smartMessUserUnsub=null;
        }
        after();
      }else if(latest.pendingJoinStatus==='rejected'){
        if(window._smartMessUserUnsub){
          window._smartMessUserUnsub();
          window._smartMessUserUnsub=null;
        }
        S.pendingJoin=null;M=null;S.screen='welcome';render();
        say(T('আপনার যোগদানের অনুরোধ অ্যাডমিন বাতিল করেছেন।','Your join request was rejected by the admin.'));
      }
    },error=>{
      console.error('PENDING MEMBERSHIP SYNC ERROR:',error);
    });

  }catch(e){
    console.error(e);

    const messages={
      USER_NOT_FOUND:'ইউজার তথ্য পাওয়া যায়নি।',
      ALREADY_IN_MESS:'আপনি ইতিমধ্যে একটি মেসে আছেন।',
      REQUEST_EXISTS:'আপনার অনুরোধ আগেই পাঠানো হয়েছে।'
    };

    say(messages[e.message]||'অনুরোধ পাঠানো যায়নি। Firebase Rules পরীক্ষা করতে হবে।');
  }
}

  async function leaveMess(){
  if(!M || M.role!=='member' || !auth.currentUser){
    return say(T('শুধু সাধারণ সদস্য মেস ত্যাগ করতে পারবেন।','Only regular members can leave the mess.'));
  }

  if(S.leavingMess)return;

  if(!confirm(T(
    'আপনি কি মেস ত্যাগ করতে চান? আপনার আগের হিসাব ও লেনদেন সংরক্ষিত থাকবে।',
    'Are you sure you want to leave this mess? Your previous accounts and transactions will be preserved.'
  ))) return;

  S.leavingMess=true;

  try{
    const uid=auth.currentUser.uid;
    const messRef=db.collection('messes').doc(M.id);
    const memberRef=messRef.collection('members').doc(uid);
    const userRef=db.collection('users').doc(uid);

    // Leave-এর আগে পুরোনো মেসের সব Listener বন্ধ করুন।
    stopMessListeners();

    await db.runTransaction(async tx=>{
      const messSnap=await tx.get(messRef);
      const memberSnap=await tx.get(memberRef);
      const userSnap=await tx.get(userRef);

      if(!messSnap.exists || !memberSnap.exists || !userSnap.exists)
        throw new Error('ACCOUNT_NOT_FOUND');

      const memberData=memberSnap.data();

      if(messSnap.data().adminUid===uid || memberData.role!=='member')
        throw new Error('ADMIN_CANNOT_LEAVE');

      if(memberData.status!=='active' || userSnap.data().messId!==M.id)
        throw new Error('NOT_ACTIVE_MEMBER');

      // বর্তমান যোগদান-কাল বন্ধ হবে; আগের হিসাবকাল আলাদা থাকবে।
      const leftAt=firebase.firestore.FieldValue.serverTimestamp();
      if(memberData.currentPeriodId){
        const periodRef=messRef.collection('membershipPeriods').doc(memberData.currentPeriodId);
        const periodSnap=await tx.get(periodRef);
        if(periodSnap.exists){
          const periodAccount=calcAllMembers().find(a=>a.periodId===memberData.currentPeriodId);
          tx.update(periodRef,{
            status:'closed',
            leftAt:leftAt,
            closedAt:firebase.firestore.FieldValue.serverTimestamp(),
            balanceFrozen:true,
            finalBalance:Number(periodAccount?.bal)||0,
            finalDeposited:Number(periodAccount?.deposited)||0,
            finalPersonalExpenses:Number(periodAccount?.personalExpenses)||0,
            finalShare:Number(periodAccount?.share)||0,
            finalPaid:Number(periodAccount?.paid)||0,
            balanceFrozenAt:firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
      tx.update(memberRef,{
        status:'left',
        leftAt:leftAt,
        currentPeriodId:firebase.firestore.FieldValue.delete()
      });

      // একই account-কে অন্য মেসে যোগ দেওয়ার সুযোগ দেওয়া হবে।
      tx.set(userRef,{messId:null},{merge:true});
    });

    say(T(
      'আপনি মেস ত্যাগ করেছেন। আগের হিসাব সংরক্ষিত আছে।',
      'You have left the mess. Your previous records are preserved.'
    ));

    // লগআউট না করে একই অ্যাকাউন্টে মেস নির্বাচন/তৈরির পেজে ফিরুন।
    S.leavingMess=false;
    await after();

  }catch(e){
    console.error('LEAVE MESS ERROR:',e);
    S.leavingMess=false;

    // Leave ব্যর্থ হলে আগের Listener আবার চালু করুন।
    if(auth.currentUser && M){
      try{ await after(); }
      catch(reloadError){ console.error('MESS RELOAD ERROR:',reloadError); }
    }

    say(T(
      'মেস ত্যাগ করা যায়নি: '+(e.message||e.code),
      'Could not leave the mess: '+(e.message||e.code)
    ));
  }
}

async function resetMess(){
  if(!M || M.role!=='admin'){
    return say('শুধু অ্যাডমিন মেস রিসেট করতে পারবেন।');
  }

  if(S.resetting)return;

  if(!confirm('আপনি কি মেসের বর্তমান হিসাব রিসেট করতে চান? পুরোনো খরচ ও মিল History-তে সংরক্ষণ হবে।')){
    return;
  }

  S.resetting=true;
  let archiveComplete=false;

  try{
    say('পুরোনো হিসাব সংরক্ষণ করা হচ্ছে...');

    const messRef=db.collection('messes').doc(M.id);
    const historyRef=messRef.collection('history').doc();

    const [expensesSnap,mealsSnap,depositsSnap]=await Promise.all([
  messRef.collection('expenses').get(),
  messRef.collection('mealCounts').get(),
  messRef.collection('deposits').get()
]);

    await historyRef.set({
      status:'preparing',
      messName:M.name,
      messType:M.type,
      currency:M.cur,
      monthLabel:new Date().toLocaleDateString('bn-BD',{
        month:'long',
        year:'numeric'
      }),
      members:M.memberUids.map((uid,i)=>({
        uid:uid,
        name:M.members[i],
        phone:M.memberPhones[i]||''
      })),
            expenseCount:expensesSnap.size,
      mealCount:mealsSnap.size,
      depositCount:depositsSnap.size,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    const writes=[];

    expensesSnap.docs.forEach(doc=>{
      writes.push({
        ref:historyRef.collection('expenses').doc(doc.id),
        data:doc.data()
      });
    });

        mealsSnap.docs.forEach(doc=>{
      writes.push({
        ref:historyRef.collection('mealCounts').doc(doc.id),
        data:doc.data()
      });
    });
        depositsSnap.docs.forEach(doc=>{
      writes.push({
        ref:historyRef.collection('deposits').doc(doc.id),
        data:doc.data()
      });
    });

    for(let i=0;i<writes.length;i+=400){
      const batch=db.batch();

      writes.slice(i,i+400).forEach(item=>{
        batch.set(item.ref,item.data);
      });

      await batch.commit();
    }

    await historyRef.update({
      status:'complete'
    });

    archiveComplete=true;

    say('History সংরক্ষিত। নতুন হিসাব শুরু হচ্ছে...');

    const deletes=[
  ...expensesSnap.docs.map(doc=>doc.ref),
  ...mealsSnap.docs.map(doc=>doc.ref),
  ...depositsSnap.docs.map(doc=>doc.ref)
];

    for(let i=0;i<deletes.length;i+=400){
      const batch=db.batch();

      deletes.slice(i,i+400).forEach(ref=>{
        batch.delete(ref);
      });

      await batch.commit();
    }
      await cleanupOldHistory();

    S.tab='home';
    say('মেস রিসেট সম্পন্ন হয়েছে। পুরোনো হিসাব History-তে আছে।');

  }catch(e){
    console.error('MESS RESET ERROR:',e);

    if(archiveComplete){
      say('History নিরাপদে সংরক্ষিত হয়েছে, তবে পুরোনো হিসাব পরিষ্কার করতে সমস্যা হয়েছে। অ্যাডমিনের সাহায্য নিন।');
    }else{
      say('History সংরক্ষণ সম্পূর্ণ হয়নি। কোনো পুরোনো হিসাব মুছে ফেলা হয়নি। আবার চেষ্টা করুন।');
    }

  }finally{
    S.resetting=false;
  }
}

  const meals=members.map(()=>0);

  const money=x=>`${esc(h.currency||'')} ${fmt(x)}`;

  // পুরোনো খরচের হিসাব
  expenses.forEach(e=>{

    const index=members.findIndex(m=>m.uid===e.payerUid);

    if(index>=0)paid[index]+=Number(e.amt)||0;

  async function cleanupOldHistory(){
  const historyRef=db.collection('messes')
    .doc(M.id)
    .collection('history');

  const snap=await historyRef.get();

  const completed=snap.docs
    .filter(doc=>doc.data().status==='complete')
    .sort((a,b)=>{
      const ta=a.data().createdAt?.toMillis?.()||0;
      const tb=b.data().createdAt?.toMillis?.()||0;
      return tb-ta;
    });

  // সর্বশেষ ৩টি বাদে বাকিগুলো মুছে ফেলবে
  const oldHistory=completed.slice(3);

  for(const historyDoc of oldHistory){
    const [expenses,meals,deposits]=await Promise.all([
  historyDoc.ref.collection('expenses').get(),
  historyDoc.ref.collection('mealCounts').get(),
  historyDoc.ref.collection('deposits').get()
]);

    const deletes=[
  ...expenses.docs.map(d=>d.ref),
  ...meals.docs.map(d=>d.ref),
  ...deposits.docs.map(d=>d.ref)
];

    for(let i=0;i<deletes.length;i+=400){
      const batch=db.batch();

      deletes.slice(i,i+400).forEach(ref=>{
        batch.delete(ref);
      });

      await batch.commit();
    }

    await historyDoc.ref.delete();
  }
}
  async function saveDeposit(){
  if(S.savingDeposit)return;

  const editingId=S.editDepositId||null;
  const memberSelect=document.getElementById('depositMember');
  const memberIndex=M.role==='admin'
    ? Number(memberSelect?.value)
    : M.me;
  const amt=Number(document.getElementById('depositAmount')?.value);

  if(!Number.isFinite(amt)||amt<=0){
    return say(T('সঠিক টাকার পরিমাণ দিন','Enter a valid amount'));
  }

  if(!editingId&&(!Number.isInteger(memberIndex)||memberIndex<0||memberIndex>=M.memberUids.length)){
    return say(T('সদস্য নির্বাচন সঠিক নয়','Please select a valid member'));
  }

  if(editingId&&!isDepositAdmin()){
    return say(T('শুধু এডমিন জমা পরিবর্তন করতে পারবেন','Only the admin can edit deposits'));
  }

  S.savingDeposit=true;

  try{
    const depositRef=db.collection('messes').doc(M.id).collection('deposits');
    if(editingId){
      const record=(M.deposits||[]).find(d=>d.id===editingId);
      if(!record)throw new Error('Deposit record not found');
      await depositRef.doc(editingId).update({amt:amt});
      S.editDepositId=null;
      say(T('জমার পরিমাণ সংশোধন হয়েছে','Deposit updated successfully'));
    }else{
      const depositUid=M.memberUids[memberIndex];
      const depositMember=(M.allMembers||[]).find(m=>m.uid===depositUid);
      await depositRef.add({
        uid:depositUid,
        periodId:depositMember?.currentPeriodId||null,
        amt:amt,
        addedBy:auth.currentUser.uid,
        date:firebase.firestore.FieldValue.serverTimestamp()
      });
      say(T('জমা সফলভাবে সংরক্ষণ হয়েছে','Deposit saved successfully'));
    }
    render();
  }catch(e){
    console.error('SAVE/EDIT DEPOSIT ERROR:',e);
    say(editingId?T('জমা পরিবর্তন করা যায়নি। Firestore অনুমতি পরীক্ষা করুন।','Could not edit deposit. Check Firestore permissions.'):T('জমা সংরক্ষণ করা যায়নি','Could not save deposit'));
  }finally{
    S.savingDeposit=false;
    render();
  }
}

function isDepositAdmin(){
  return !!(M && auth.currentUser && M.role==='admin' && M.adminUid===auth.currentUser.uid);
}

function depositDateTime(record){
  const date=record.date?.toDate?.();
  if(!date)return T('তারিখ পাওয়া যায়নি','Date unavailable');
  const locale=L==='bn'?'bn-BD':'en-US';
  const day=date.toLocaleDateString(locale,{day:'numeric',month:'short'});
  const time=date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase();
  return day+' · '+time;
}

async function deleteDeposit(id){
  if(!isDepositAdmin())return say(T('শুধু এডমিন জমা মুছতে পারবেন','Only the admin can delete deposits'));
  const record=(M.deposits||[]).find(d=>d.id===id);
  if(!record)return say(T('জমার রেকর্ড পাওয়া যায়নি','Deposit record not found'));

  const memberIndex=M.memberUids.indexOf(record.uid);
  const memberName=memberIndex>=0?M.members[memberIndex]:T('সদস্য','Member');
  if(!confirm(T(
    memberName+'-এর '+Number(record.amt).toFixed(2)+' '+M.cur+' জমার রেকর্ডটি ডিলিট করবেন? এই কাজ ফিরিয়ে আনা যাবে না।',
    'Delete this '+Number(record.amt).toFixed(2)+' '+M.cur+' deposit from '+memberName+'? This cannot be undone.'
  )))return;

  try{
    await db.collection('messes').doc(M.id).collection('deposits').doc(id).delete();
    say(T('জমার রেকর্ড ডিলিট হয়েছে','Deposit record deleted'));
  }catch(e){
    console.error('DELETE DEPOSIT ERROR:',e);

  }
}

    async function deleteMess(){
  if(!M || M.role!=='admin' || !auth.currentUser)
    return say(T('শুধু Admin মেস ডিলিট করতে পারবেন।','Only the admin can delete this mess.'));

  if(S.deletingMess)return;

  const messName=M.name||'';
  const messCode=String(M.code||'').toUpperCase();

  if(!confirm(T(
    'আপনি কি "'+messName+'" মেসটি বন্ধ করতে চান?\n\nসব সদস্যের অ্যাকাউন্ট এই মেস থেকে বিচ্ছিন্ন হবে। পুরোনো হিসাব ও লেনদেন সংরক্ষিত থাকবে।',
    'Close "'+messName+'"?\n\nAll members will be disconnected from this mess. Previous accounts and transactions will be preserved.'
  ))) return;

  const enteredCode=prompt(T(
    'নিশ্চিত করতে মেসের কোড লিখুন: '+messCode,
    'Enter the mess code to confirm: '+messCode
  ));

  if(enteredCode===null)return;
  if(enteredCode.trim().toUpperCase()!==messCode)
    return say(T('মেসের কোড সঠিক নয়। ডিলিট করা হয়নি।','Incorrect mess code. Nothing was deleted.'));

  S.deletingMess=true;

  try{
    const uid=auth.currentUser.uid;
    const messRef=db.collection('messes').doc(M.id);
    const userRef=db.collection('users').doc(uid);

    // পুরোনো হিসাব বা subcollection কোনো কিছুই delete করা হবে না।
    stopMessListeners();

    await messRef.update({
      status:'deleted',
      deletedAt:firebase.firestore.FieldValue.serverTimestamp(),
      deletedBy:uid
    });

    // Admin-ও নিজের account থেকে এই mess বিচ্ছিন্ন করবেন।
    // Parent mess বন্ধ হয়ে গেলে UI-কে সঙ্গে সঙ্গে Welcome screen-এ নিতে হবে।
    let detachFailed=false;
    try{
      await userRef.update({messId:null});
    }catch(detachError){
      detachFailed=true;
      console.warn('ADMIN DETACH UPDATE FAILED; RECOVERING FROM DELETED MESS:',detachError);
    }

    M=null;
    S.pendingJoin=null;
    S.screen='welcome';
    S.tab='home';
    S.deletingMess=false;
    S.toast='';
    render();

    if(detachFailed){
      try{await after();}catch(recoveryError){
        console.error('DELETE MESS DETACH RECOVERY ERROR:',recoveryError);
      }
    }

    // Native confirmation popup নিশ্চিতভাবে দেখাবে; toast-এর উপর নির্ভর করবে না।
    setTimeout(()=>{
      alert(T(
        'মেসটি সফলভাবে ডিলিট হয়েছে। পুরোনো হিসাব সংরক্ষিত আছে।',
        'The mess was deleted successfully. Previous records are preserved.'
      ));
    },150);
  }catch(e){
    console.error('DELETE MESS ERROR:',e);
    S.deletingMess=false;
    try{await after();}catch(reloadError){
      console.error('DELETE MESS RECOVERY ERROR:',reloadError);
    }
    say(T(
      'মেস বন্ধ করা যায়নি: '+(e.message||e.code||'Unknown error'),
      'Could not close the mess: '+(e.message||e.code||'Unknown error')
    ));
  }
}

  // Adminship transfer
async function transferAdmin(i){
  if(!M || M.role !== 'admin')
    return say('শুধু Admin এই কাজ করতে পারবেন।');

  const currentUid=auth.currentUser.uid;
  const targetUid=M.memberUids[i];
  const targetName=M.members[i];

  if(!targetUid || targetUid===currentUid)
    return;

  if(!confirm(T(
    targetName+'-কে কি নতুন Admin করতে চান?',
    'Transfer Admin rights to '+targetName+'?'
  ))) return;

  try{
    const messRef=db.collection('messes').doc(M.id);
    const oldRef=messRef.collection('members').doc(currentUid);
    const newRef=messRef.collection('members').doc(targetUid);

    await db.runTransaction(async tx=>{
      const messSnap=await tx.get(messRef);
      const oldSnap=await tx.get(oldRef);
      const newSnap=await tx.get(newRef);

      if(!messSnap.exists ||
         messSnap.data().adminUid!==currentUid ||
         !oldSnap.exists ||
         oldSnap.data().role!=='admin' ||
         oldSnap.data().status!=='active')
        throw new Error('NOT_ADMIN');

      if(!newSnap.exists ||
         newSnap.data().role!=='member' ||
         newSnap.data().status!=='active')
        throw new Error('INVALID_MEMBER');

      tx.update(messRef,{
        adminUid:targetUid
      });

      tx.update(oldRef,{
        role:'member'
      });

      tx.update(newRef,{
        role:'admin'
      });
    });

    M.role='member';
    M.adminUid=targetUid;

    say(T(
      'Adminship সফলভাবে হস্তান্তর হয়েছে।',
      'Admin rights transferred successfully.'
    ));

    render();

  }catch(e){
    console.error('ADMIN TRANSFER ERROR:',e);
    say(T(
      'Admin পরিবর্তন করা যায়নি: '+(e.message||e.code),
      'Admin transfer failed: '+(e.message||e.code)
    ));
  }
}

async function addFormerPayment(periodId){
  if(!M||M.role!=='admin')return;
  const p=(M.periods||[]).find(x=>x.id===periodId);
  if(!p||p.balanceFrozen!==true)return say('সাবেক সদস্যের সংরক্ষিত হিসাব পাওয়া যায়নি।');
  const original=Number(p.finalBalance)||0;
  const summary=formerSettlementSummary(periodId,original);
  if(Math.abs(summary.remaining)<0.005)return say('এই হিসাবের কোনো বকেয়া নেই।');
  const input=prompt('পরিশোধের পরিমাণ লিখুন ('+M.cur+')। বাকি: '+Math.abs(summary.remaining).toFixed(2));
  if(input===null)return;
  const amount=Number(String(input).replace(',','.'));
  if(!Number.isFinite(amount)||amount<=0)return say('সঠিক পরিমাণ লিখুন।');
  if(amount>Math.abs(summary.remaining)+0.005)return say('পরিশোধের পরিমাণ বাকি টাকার চেয়ে বেশি হতে পারবে না।');
  try{
    await db.collection('messes').doc(M.id).collection('formerSettlements').add({
      periodId:periodId,uid:p.uid,name:p.name||'',kind:'payment',amount:amount,
      direction:summary.remaining<0?'toMess':'fromMess',
      addedBy:auth.currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    say('পরিশোধের টাকা সংরক্ষণ হয়েছে।');
  }catch(e){console.error('FORMER PAYMENT ERROR:',e);say('পরিশোধ যোগ করা যায়নি: '+(e.code||e.message));}
}

// সাবেক সদস্যদের তালিকা ও সর্বমোট মিল লোড
async function loadFormerMembers(){
  if(!M || M.role!=='admin') return;

  try{
    const messRef=db.collection('messes').doc(M.id);

    const [membersSnap,mealsSnap,historySnap]=await Promise.all([
      messRef.collection('members')
        .where('status','==','left')
        .get(),

      messRef.collection('mealCounts').get(),

      messRef.collection('history').get()
    ]);

    // প্রত্যেক সদস্যের মোট মিল
    const mealTotals={};

    // বর্তমান মাসের মিল যোগ
    mealsSnap.docs.forEach(doc=>{
      mealTotals[doc.id]=
        (mealTotals[doc.id]||0)+
        (Number(doc.data().count)||0);
    });

    // সব পুরোনো History-র মিল যোগ
    historySnap.docs.forEach(doc=>{
      const records=doc.data().mealRecords||[];

      records.forEach(r=>{
        const uid=r.uid||r.id;
        if(!uid) return;

        mealTotals[uid]=
          (mealTotals[uid]||0)+
          (Number(r.count)||0);
      });
    });

    // সাবেক সদস্যদের তথ্য তৈরি
    M.formerMembers=membersSnap.docs.map(doc=>({
      uid:doc.id,
      ...doc.data(),
      meals:mealTotals[doc.id]||0
    }));

    S.tab='formerMembers';
    render();

  }catch(e){
    console.error('FORMER MEMBERS ERROR:',e);
    say('সাবেক সদস্যদের তালিকা লোড করা যায়নি।');
  }
}

async function removeMember(i){
  if(!M || M.role!=='admin')
    return say('শুধু Admin এই কাজ করতে পারবেন।');

  const currentUid=auth.currentUser.uid;
  const targetUid=M.memberUids[i];
  const targetName=M.members[i];

  if(!targetUid || targetUid===currentUid)
    return;

  if(!confirm(T(
    'আপনি কি '+targetName+'-কে মেস থেকে বিদায় দিতে চান? তার পুরোনো হিসাব সংরক্ষিত থাকবে।',
    'Remove '+targetName+' from the mess? Their old accounting records will be preserved.'
  ))) return;

  try{
    const messRef=db.collection('messes').doc(M.id);
    const adminRef=messRef.collection('members').doc(currentUid);
    const targetRef=messRef.collection('members').doc(targetUid);
    const userRef=db.collection('users').doc(targetUid);

    await db.runTransaction(async tx=>{
      const messSnap=await tx.get(messRef);
      const adminSnap=await tx.get(adminRef);
      const targetSnap=await tx.get(targetRef);
      
      if(!messSnap.exists ||
         messSnap.data().adminUid!==currentUid ||
         !adminSnap.exists ||
         adminSnap.data().role!=='admin' ||
         adminSnap.data().status!=='active')
        throw new Error('NOT_ADMIN');

      if(!targetSnap.exists ||
   targetSnap.data().role!=='member' ||
   targetSnap.data().status!=='active')
  throw new Error('INVALID_MEMBER');

      // পুরোনো সদস্যের রেকর্ড থাকবে, শুধু Status পরিবর্তন হবে
      const targetData=targetSnap.data();
      const leftAt=firebase.firestore.FieldValue.serverTimestamp();
      if(targetData.currentPeriodId){
        const periodRef=messRef.collection('membershipPeriods').doc(targetData.currentPeriodId);
        const periodSnap=await tx.get(periodRef);
        if(periodSnap.exists){
          const periodAccount=calcAllMembers().find(a=>a.periodId===targetData.currentPeriodId);
          tx.update(periodRef,{
            status:'closed',
            leftAt:leftAt,
            closedAt:firebase.firestore.FieldValue.serverTimestamp(),
            balanceFrozen:true,
            finalBalance:Number(periodAccount?.bal)||0,
            finalDeposited:Number(periodAccount?.deposited)||0,
            finalPersonalExpenses:Number(periodAccount?.personalExpenses)||0,
            finalShare:Number(periodAccount?.share)||0,
            finalPaid:Number(periodAccount?.paid)||0,
            balanceFrozenAt:firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      }
      tx.update(targetRef,{
        status:'left',
        leftAt:leftAt,
        currentPeriodId:firebase.firestore.FieldValue.delete()
      });

      // সদস্যের Account অন্য মেসে যোগ দেওয়ার জন্য মুক্ত হবে
      tx.update(userRef,{
        messId:null
      });
    });

    // Active ও সব সদস্যের তালিকা নতুন করে লোড
const [snap,allMembersSnap]=await Promise.all([
  messRef.collection('members')
    .where('status','==','active').get(),
  messRef.collection('members').get()
]);

M.memberUids=snap.docs.map(d=>d.id);
M.members=snap.docs.map(d=>d.data().name);
M.memberPhones=snap.docs.map(d=>d.data().phone||'');
M.me=M.memberUids.indexOf(currentUid);

M.allMembers=allMembersSnap.docs.map(d=>({
  uid:d.id,
  name:d.data().name,
  status:d.data().status,
  joinedAt:d.data().joinedAt,
  leftAt:d.data().leftAt||null,
  currentPeriodId:d.data().currentPeriodId||null,
  periodCount:Number(d.data().periodCount)||1
}));
const periodsSnap=await messRef.collection('membershipPeriods').get();
M.periods=periodsSnap.docs.map(d=>({id:d.id,...d.data()}));

    say(T(
      'সদস্যকে সফলভাবে বিদায় দেওয়া হয়েছে। পুরোনো হিসাব সংরক্ষিত আছে।',
      'Member removed successfully. Previous records are preserved.'
    ));

    render();

  }catch(e){
    console.error('REMOVE MEMBER ERROR:',e);
    say(T(
      'সদস্যকে বিদায় দেওয়া যায়নি: '+(e.message||e.code),
      'Could not remove member: '+(e.message||e.code)
    ));
  }
}

async function changeMeal(i,delta){
  if(i!==M.me) return;

  const uid=M.memberUids[i];
  const ref=db.collection('messes')
    .doc(M.id)
    .collection('mealCounts')
    .doc(uid);

  const current=Number(M.meals[i])||0;
  const count=Math.max(0,current+delta);

  if(count===current) return;

  try{
    await ref.set({
      count:count,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
  }catch(e){
    console.error('MEAL SAVE ERROR:',e);
    say('মিল সংরক্ষণ হয়নি: '+(e.code||e.message));
  }
}
function dailyMealLocalDate(){
  const today=new Date();
  return today.getFullYear()+'-'+
    String(today.getMonth()+1).padStart(2,'0')+'-'+
    String(today.getDate()).padStart(2,'0');
}

function dailyMealDraftKey(date,uid){
  return M.id+'_'+date+'_'+uid;
}

function dailyMealDraftValue(date,uid){
  const key=dailyMealDraftKey(date,uid);
  const saved=(M.dailyMeals||[]).find(x=>x.id===date+'_'+uid);
  const original=Number(saved?.count)||0;
  const drafts=window._smartMessDailyMealDrafts||(window._smartMessDailyMealDrafts={});
  return {
    original,
    count:Object.prototype.hasOwnProperty.call(drafts,key)
      ? drafts[key]
      : original,
    dirty:Object.prototype.hasOwnProperty.call(drafts,key)
      && drafts[key]!==original
  };
}

    return say('অন্য সদস্যের মিল পরিবর্তনের অনুমতি নেই।');

  const date=document.getElementById('dailyMealDate')?.value||dailyMealLocalDate();
  const key=dailyMealDraftKey(date,uid);
  const state=dailyMealDraftValue(date,uid);
  const next=Math.max(0,state.count+delta);

  if(next===state.count) return;

  const drafts=window._smartMessDailyMealDrafts||(window._smartMessDailyMealDrafts={});
  drafts[key]=next;
  render();
}

async function saveDailyMeal(uid){
  if(M.type!=='meal') return;

  const myUid=auth.currentUser.uid;
  if(uid!==myUid && M.role!=='admin')
    return say('অন্য সদস্যের মিল পরিবর্তনের অনুমতি নেই।');

  const date=document.getElementById('dailyMealDate')?.value||dailyMealLocalDate();
  const key=dailyMealDraftKey(date,uid);
  const state=dailyMealDraftValue(date,uid);

  if(!state.dirty) return say('নতুন কোনো পরিবর্তন নেই।');

  try{
    await db.collection('messes')
      .doc(M.id)
      .collection('dailyMeals')
      .doc(date+'_'+uid)
      .set({
        uid:uid,
        date:date,
        count:state.count,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
        updatedBy:myUid
      },{merge:true});

    if(window._smartMessDailyMealDrafts)
      delete window._smartMessDailyMealDrafts[key];

    say('মিল সফলভাবে সেভ হয়েছে।');
    render();

  }catch(e){
    console.error('DAILY MEAL SAVE ERROR:',e);
    say('মিল সেভ হয়নি: '+(e.code||e.message));
  }
}

      const blob=pdf.output('blob');
      const file=new File([blob],filename,{type:'application/pdf'});
      if(navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Smart-Mess Report'});

function taskView(){

  const allTasks=M.tasks||[];

  const getTaskTime=v=>{
    if(!v)return 0;
    if(typeof v.toMillis==='function')return v.toMillis();
    if(v instanceof Date)return v.getTime();
    const n=Date.parse(v);
    return Number.isFinite(n)?n:0;
  };

  const pendingTasks=allTasks.filter(t=>!t.isDone);

  const completedTasks=allTasks
    .filter(t=>t.isDone)
    .sort((a,b)=>getTaskTime(b.completedAt)-getTaskTime(a.completedAt))
    .slice(0,3);

  const renderTask=t=>{

    const creator=M.members[M.memberUids.indexOf(t.createdBy)]||'';
    const completer=M.members[M.memberUids.indexOf(t.completedBy)]||'';

    const isDone=t.isDone===true;
    const isOwner=t.createdBy===auth.currentUser.uid;
    const canEdit=!isDone&&isOwner;
    const canDelete=!isDone&&(M.role==='admin'||isOwner);

    const completedDate=
      t.completedAt&&typeof t.completedAt.toDate==='function'
      ?t.completedAt.toDate().toLocaleString()
      :t.completedAt instanceof Date
      ?t.completedAt.toLocaleString()
      :'';

    return `
      <div class="task-item ${isDone?'done':''}">

        <button class="task-check"
          ${isDone?'disabled':`onclick="toggleTask('${t.id}')"`}>
          ${isDone?'✓':'○'}
        </button>

        <div class="task-info">

          <div class="task-title">${esc(t.title||'')}</div>

          ${t.quantity?`
            <div class="task-meta">
              ${T('পরিমাণ','Quantity')}: ${esc(t.quantity)}
            </div>
          `:''}

          <div class="task-meta">
            ${T('যোগ করেছেন','Added by')}: ${esc(creator)}
          </div>

          ${isDone?`
            <div class="task-meta">
              ${T('সম্পন্ন করেছেন','Completed by')}: ${esc(completer)}
            </div>
            ${completedDate?`
              <div class="task-meta">${esc(completedDate)}</div>
            `:''}
          `:''}

          

        </div>
         <span class="task-status ${isDone?'completed':'pending'}">
  ${isDone?T('সম্পন্ন','Completed'):T('অসম্পন্ন','Pending')}
</span>
        ${canEdit||canDelete?`
          <div class="task-actions">
            <button class="task-more" onclick="taskMenu('${t.id}')">⋮</button>

            ${(S.taskMenu==t.id)?`
              <div class="row">
                ${canEdit?`
                  <button class="btn ghost" onclick="editTask('${t.id}')">
                    ${T('এডিট','Edit')}
                  </button>
                `:''}

                ${canDelete?`
                  <button class="btn ghost" onclick="deleteTask('${t.id}')">
                    ${T('মুছুন','Delete')}
                  </button>
                `:''}
              </div>
            `:''}
          </div>
        `:''}

      </div>
    `;
  };

  return `
    <div class="task-page">

      <div class="task-head">
        <div class="task-heading">
          <div class="task-heading-icon">📋</div>
          <div>
            <h2>${T('আমাদের টাস্ক','Our Tasks')}</h2>
            <p>${T('মেসের কাজগুলো একসাথে সম্পন্ন করি','Complete mess tasks together')}</p>
          </div>
        </div>
      </div>

      <div class="task-form" id="taskForm">
        <h3>${T('নতুন টাস্ক যোগ করুন','Add New Task')}</h3>

        <input id="taskTitle"
          placeholder="${T('কী কিনতে হবে?','What needs to be bought?')}">

        <input id="taskQty"
          placeholder="${T('পরিমাণ (ঐচ্ছিক)','Quantity (optional)')}">

        <button class="task-add-toggle" onclick="addTask()">
          + ${T('নতুন টাস্ক যোগ করুন','Add New Task')}
        </button>
      </div>

      <div class="task-section pending-section">
        <div class="task-heading">
          <h3>${T('অসম্পন্ন কাজ','Pending Tasks')}</h3>
          <span class="task-count">${pendingTasks.length}</span>
        </div>

        ${pendingTasks.length
          ?pendingTasks.map(renderTask).join('')
          :`<div class="task-empty">${T('কোনো অসম্পন্ন কাজ নেই','No pending tasks')}</div>`
        }
      </div>

      <div class="task-section completed-section">
        <div class="task-heading">
          <h3>${T('সম্পন্ন কাজ','Completed Tasks')}</h3>
          <span class="task-count">${completedTasks.length}</span>
        </div>

        ${completedTasks.length
          ?completedTasks.map(renderTask).join('')
          :`<div class="task-empty">${T('এখনো কোনো কাজ সম্পন্ন হয়নি','No completed tasks yet')}</div>`
        }
      </div>

    </div>
  `;
}

  async function addTask(){
  const title=document.getElementById('taskTitle').value.trim();
  const quantity=document.getElementById('taskQty').value.trim();
  
  if(!title){
    say('টাস্কের নাম লিখুন।');
    return;
  }

  try{
    await db.collection('messes').doc(M.id)
      .collection('tasks').add({
        title,
        quantity,
        createdBy:auth.currentUser.uid,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        isDone:false,
        completedBy:null,
        completedAt:null,
        deleteAt:null
      });

    say('টাস্ক সফলভাবে যোগ হয়েছে।');

  }catch(error){
    console.error('ADD TASK ERROR:',error);
    say('টাস্ক যোগ করা যায়নি।');
  }
}
  async function toggleTask(id){

  try{

    const taskRef=db.collection('messes').doc(M.id)
      .collection('tasks').doc(id);

    const taskSnap=await taskRef.get();

    if(!taskSnap.exists){
      say('টাস্কটি পাওয়া যায়নি।');
      return;
    }

    const task=taskSnap.data();

    if(task.isDone===true){
      say('এই টাস্কটি ইতিমধ্যে সম্পন্ন হয়েছে।');
      return;
    }

    const now=new Date();

    const deleteAt=new Date(
      now.getTime()+(48*60*60*1000)
    );

    await taskRef.update({

      isDone:true,

      completedBy:auth.currentUser.uid,

      completedAt:firebase.firestore.Timestamp.fromDate(now),

      deleteAt:firebase.firestore.Timestamp.fromDate(deleteAt)

    });

    say('টাস্ক সম্পন্ন হয়েছে।');

  }catch(error){

    console.error('TASK UPDATE ERROR:',error);

    say('টাস্ক আপডেট করা যায়নি।');

  }
}
  
  function taskMenu(id){
  S.taskMenu=S.taskMenu==id?null:id;
  render();
}
async function deleteTask(id){

  try{

    const taskRef=db.collection('messes').doc(M.id)
      .collection('tasks').doc(id);

    const taskSnap=await taskRef.get();

    if(!taskSnap.exists){
      say('টাস্কটি পাওয়া যায়নি।');
      return;
    }

    const task=taskSnap.data();

    if(task.isDone===true){
      say('সম্পন্ন টাস্ক মুছে ফেলা যাবে না।');
      return;
    }

    const isOwner=task.createdBy===auth.currentUser.uid;
    const isAdmin=M.role==='admin';

    if(!isOwner&&!isAdmin){
      say('শুধু নিজের টাস্ক অথবা Admin টাস্ক মুছতে পারবেন।');
      return;
    }

    if(!confirm('এই টাস্কটি মুছে ফেলতে চান?'))return;

    await taskRef.delete();

    S.taskMenu=null;

    say('টাস্ক মুছে ফেলা হয়েছে।');

  }catch(error){

    console.error('DELETE TASK ERROR:',error);

    say('টাস্ক মুছে ফেলা যায়নি।');

  }
}
 async function editTask(id){

  try{

    const taskRef=db.collection('messes').doc(M.id)
      .collection('tasks').doc(id);

    const taskSnap=await taskRef.get();

    if(!taskSnap.exists){
      say('টাস্কটি পাওয়া যায়নি।');
      return;
    }

    const t=taskSnap.data();

    if(t.createdBy!==auth.currentUser.uid||t.isDone===true){
      say('শুধু নিজের অসম্পন্ন টাস্ক এডিট করা যাবে।');
      return;
    }

    const title=prompt('টাস্কের নাম:',t.title||'');

    if(title===null)return;

    if(!title.trim()||title.trim().length>100){
      say('সঠিক টাস্কের নাম লিখুন।');
      return;
    }

    const quantity=prompt('পরিমাণ:',t.quantity||'');
    if(quantity===null)return;

    const note=prompt('অতিরিক্ত তথ্য:',t.note||'');
    if(note===null)return;

    // সম্পাদনার আগে আবার যাচাই
    const latestSnap=await taskRef.get();

    if(!latestSnap.exists||latestSnap.data().isDone===true){
      say('টাস্কটি ইতিমধ্যে সম্পন্ন হয়েছে।');
      return;
    }

    if(latestSnap.data().createdBy!==auth.currentUser.uid){
      say('শুধু নিজের টাস্ক এডিট করা যাবে।');
      return;
    }

    await taskRef.update({
      title:title.trim(),
      quantity:quantity.trim(),
      note:note.trim()
    });

    S.taskMenu=null;

    say('টাস্ক এডিট হয়েছে।');

  }catch(error){

    console.error('EDIT TASK ERROR:',error);

    say('টাস্ক এডিট করা যায়নি।');

  }
}


function render(){
  document.body.classList.toggle('auth-screen',S.screen==='auth');
  document.body.classList.toggle('pre-mess-screen',['welcome','create','join'].includes(S.screen));
  document.body.classList.toggle('app-screen',S.screen==='app');
  document.documentElement.lang=L;
  let v,nav='';
  if(S.screen=='auth')v=authView();else if(S.screen=='welcome')v=welcomeView();else if(S.screen=='create')v=createView();else if(S.screen=='join')v=joinView();
  else{
      const tabs=S.pendingJoin?[['home','home',T('হোম','Home')]]:[['home','home',T('হোম','Home')],['add','add',T('খরচ যোগ','Add')],['expenses','receipt',T('খরচের তালিকা','Expenses')],['task','task',T('টাস্ক','Tasks')]].concat(M.type=='meal'?[['meal','meals',T('মিল','Meals')]]:[]);   
      v=({home:homeView,add:addView,meal:mealView,rep:reportView,task:taskView,req:reqView,expenses:expenseListView,members:memberListView,settings:settingsView,editMessName:editMessNameView,deposits:depositView,depositDetail:depositDetailView,history:historyView,historyDetail:historyDetailView,formerMembers:formerMembersView,about:aboutView,profile:profileView,editnumber:editNumberView,editname:editNameView}[S.tab]||homeView)();   
    nav=`<nav><div>${tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span class="sm-icon nav-icon i-${t[1]}"></span><small class="nav-label">${t[2]}</small></button>`).join('')}</div></nav>`;
  }
  document.getElementById('app').innerHTML=topbar()+(S.screen==='app'?'<div class="app-content">'+v+'</div>':v)+nav+(S.view!=null&&M.exp[S.view]?`<div class="ov" onclick="S.view=null;render()"><img src="${M.exp[S.view].memo}" alt=""></div>`:'')+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}
render();
// PULL TO REFRESH
(function(){
  let startY=0;
  let pulling=false;
  let refreshing=false;
  const limit=75;
  const indicator=document.getElementById('pullRefresh');

  document.addEventListener('touchstart',e=>{
    const area=document.querySelector('.app-content');
    if(refreshing || (area?area.scrollTop:window.scrollY)>0) return;
    startY=e.touches[0].clientY;
    pulling=true;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!pulling || refreshing) return;

    const distance=e.touches[0].clientY-startY;

    const area=document.querySelector('.app-content');
    if(distance>0 && (area?area.scrollTop:window.scrollY)<=0){
      indicator.style.transform=
        `translate(-50%,${Math.min(distance-60,12)}px)`;
    }
  },{passive:true});

  document.addEventListener('touchend',async e=>{
    if(!pulling || refreshing) return;
    pulling=false;

    const distance=e.changedTouches[0].clientY-startY;

    if(distance<limit){
      indicator.style.transform='translate(-50%,-100px)';
      return;
    }

    if(!auth.currentUser || !M){
      indicator.style.transform='translate(-50%,-60px)';
      return;
    }

    refreshing=true;
    indicator.classList.add('loading');


    try{
      await after();
      if(M) S.tab='home';
      render();
      say(T('ডাটা আপডেট হয়েছে','Data refreshed'));
    }catch(err){
      console.error('REFRESH ERROR:',err);
      say(T('ডাটা আপডেট করা যায়নি','Refresh failed'));
    }finally{
      refreshing=false;
      indicator.classList.remove('loading');
      indicator.style.transform='translate(-50%,-60px)';
    }
  },{passive:true});
})();


async function hasInternetConnection(){
  if(!navigator.onLine) return false;
  let timer;
  try{
    const controller=new AbortController();
    timer=setTimeout(()=>controller.abort(),4000);
    await fetch('https://www.gstatic.com/generate_204?smartmess='+Date.now(),{
      method:'GET',
      mode:'no-cors',
      cache:'no-store',
      signal:controller.signal
    });
    return true;
  }catch(e){
    return false;
  }finally{
    clearTimeout(timer);
  }
}

async function waitForStartupInternet(){
  clearTimeout(window._smartMessSplashFallback);
  let notified=false;
  while(!(await hasInternetConnection())){
    if(!notified){
      notified=true;
      alert('You are offline. Please turn on mobile data first.');
    }
    await new Promise(resolve=>setTimeout(resolve,2500));
  }
}

function hideSplash(){
  clearTimeout(window._smartMessSplashFallback);
  setTimeout(()=>{
    const splash=document.getElementById('splash');
    if(splash) splash.remove();
  },1200);
}

// ইন্টারনেট না থাকলে স্প্ল্যাশ স্ক্রিন সরানো হবে না।
window._smartMessSplashFallback=setTimeout(async()=>{
  const online=await hasInternetConnection();
  if(!online) return;
  console.warn('SPLASH FALLBACK: startup is taking longer than expected.');
  const splash=document.getElementById('splash');
  if(splash) splash.remove();
},15000);

auth.onAuthStateChanged(async user=>{
  // Offline অবস্থায় পাওয়া null event-কে সঙ্গে সঙ্গে logout হিসেবে ধরব না।
  await waitForStartupInternet();

  // ইন্টারনেট ফিরে আসার পর Firebase-এর সংরক্ষিত session আবার পড়ুন।
  await new Promise(resolve=>setTimeout(resolve,800));
  const activeUser=auth.currentUser||user;

  if(activeUser){
    S.user={
      uid:activeUser.uid,
      name:activeUser.displayName||activeUser.email.split('@')[0],
      email:activeUser.email
    };

    await after();
    await waitForStartupInternet();
    hideSplash();

  }else{

    // ইন্টারনেট চালু থাকা অবস্থায়ও সত্যিই signed-out হলে তবেই Login দেখান।
    stopMessListeners();
    S.user=null;
    M=null;
    S.members=[];
    S.screen='auth';

    render();
    hideSplash();
  }
});
const App = window.SmartMessApp;

if(App){
 App.addListener('backButton',()=>{
  // Welcome page থেকে Back চাপলে history navigation নয়, exit confirmation দেখান।
  if(S.screen==='welcome'){
   const exitMsg = L === 'bn'

   if(confirm(exitMsg)) App.exitApp();

  if(NAV_HISTORY.length){

  const exitMsg = L === 'bn'
 ? 'আপনি কি Smart Mess অ্যাপ থেকে বের হতে চান?'
 : 'Do you want to exit Smart Mess?';

if(confirm(exitMsg)){
   App.exitApp();
}
 });
